    <style>
        /* ===== Banner：保留 6.webp 背景图原样，内容直接浮于图上 ===== */
        .skin-header {
            background: url('../assets/img/6.webp') center/cover no-repeat;
            color: #fff;
            text-align: center;
            position: relative;
        }
        .skin-header .container { padding: 110px 20px; }
        .skin-header-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .skin-eyebrow {
            display: inline-block;
            background: #f2b705;
            color: #5a3d00;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .5px;
            padding: 6px 16px;
            border-radius: 999px;
        }
        .skin-header h1 {
            font-size: clamp(2rem, 5vw, 2.8rem);
            margin: 4px 0 0;
            color: #fff;
            position: relative;
            display: inline-block;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.72), 0 1px 4px rgba(0, 0, 0, 0.55);
        }
        .skin-header p {
            font-size: 1.1rem;
            opacity: .95;
            margin: 0;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.68), 0 1px 3px rgba(0, 0, 0, 0.5);
        }
        .skin-hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        /* ===== 通用按钮 ===== */
        .skin-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 26px;
            border-radius: 999px;
            font-size: .95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all .25s ease;
            border: none;
            cursor: pointer;
        }
        .skin-btn::after { content: none !important; }
        .skin-btn.primary {
            background: #2e6fdb;
            color: #fff;
            box-shadow: 0 6px 18px rgba(46,111,219,0.35);
        }
        .skin-btn.primary:hover {
            background: #1d4fa0;
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(46,111,219,0.45);
        }
        .skin-btn.secondary {
            background: #fff;
            color: #c99705;
            border: 2px solid #f2b705;
        }
        .skin-btn.secondary:hover {
            background: #fffaf0;
            transform: translateY(-2px);
        }

        /* ===== 页面浅底 ===== */
        .skin-page { padding: 48px 0; background: #f5f8ff; }

        /* ===== 区块标题 ===== */
        .section-head { text-align: center; margin-bottom: 28px; }
        .section-head h2 {
            font-size: 1.6rem;
            color: #1d4fa0;
            margin: 0 0 6px;
            position: relative;
            display: inline-block;
        }
        .section-head p { color: #5f6b85; font-size: .98rem; margin: 0; }

        /* ===== 精选皮肤网格 ===== */
        .skin-feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 48px;
        }
        .feature-card {
            background: #fff;
            border: 1px solid #e3e9f5;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            text-decoration: none;
            transition: all .28s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 34px rgba(18,58,122,0.12);
            border-color: #c9d8f5;
        }
        .feature-thumb {
            width: 84px;
            height: 96px;
            border-radius: 14px;
            background: #e9f0fb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .feature-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            image-rendering: pixelated;
        }
        .feature-meta { display: flex; align-items: center; gap: 8px; }
        .feature-name { font-size: 1.05rem; font-weight: 700; color: #1d4fa0; }
        .feature-go { font-size: .9rem; color: #c99705; font-weight: 600; transition: color .2s; }
        .feature-card:hover .feature-go { color: #2e6fdb; }

        /* ===== 方案B：指路大卡 + 三能力点 ===== */
        .skin-cta-card {
            display: flex;
            align-items: center;
            gap: 22px;
            background: #fff;
            border: 1px solid #e3e9f5;
            border-radius: 16px;
            padding: 28px 32px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(18,58,122,0.06);
        }
        .skin-cta-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: #2e6fdb;
        }
        .skin-cta-icon {
            flex: 0 0 auto;
            width: 56px; height: 56px; border-radius: 16px;
            background: #2e6fdb;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: #fff;
            box-shadow: 0 4px 16px rgba(46,111,219,0.3);
        }
        .skin-cta-body { flex: 1 1 auto; min-width: 0; }
        .skin-cta-title {
            font-size: 1.2rem; font-weight: 700;
            margin: 0 0 5px; color: #1d4fa0;
        }
        .skin-cta-sub {
            font-size: 0.92rem; color: #6b7689;
            margin: 0; line-height: 1.6;
        }
        .skin-cta-actions {
            flex: 0 0 auto;
            display: flex; gap: 12px;
        }

        .skin-points {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 22px;
        }
        .skin-point {
            background: #fff;
            border: 1px solid #e3e9f5;
            border-radius: 14px;
            padding: 24px 20px;
            text-align: center;
            transition: all .3s ease;
        }
        .skin-point:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(18,58,122,0.1);
            border-color: #c9d8f5;
        }
        .skin-point-icon {
            width: 60px; height: 60px; border-radius: 16px;
            background: #fff; border: 1px solid #f2b705;
            color: #c99705;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px; font-size: 26px;
        }
        .skin-point-title {
            font-size: 1.02rem; font-weight: 700;
            margin: 0 0 4px; color: #1d4fa0;
        }
        .skin-point-desc {
            font-size: 0.86rem; color: #6b7689;
            margin: 0; line-height: 1.5;
        }

        @media (max-width: 768px) {
            .skin-points { grid-template-columns: 1fr; }
            .skin-feature-grid { grid-template-columns: 1fr; }
            .skin-header .container { padding: 64px 20px; }
            .skin-hero-actions { flex-direction: column; align-items: stretch; }
            .skin-hero-actions .skin-btn { justify-content: center; }
            .skin-cta-card { flex-direction: column; text-align: center; }
            .skin-cta-actions { flex-direction: column; width: 100%; }
            .skin-cta-actions .skin-btn { justify-content: center; }
        }
    </style>
</head>
