<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="../assets/img/m.webp">
    <link rel="shortcut icon" href="../assets/img/m.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维护中 - 万驹同源</title>
    <meta name="description" content="万驹同源服务器正在维护中，敬请期待！">
    <link rel="stylesheet" href="../css/style.css?v=4.12">
    <link rel="stylesheet" href="../css/font-awesome/all.min.css">
    <style>
        * { box-sizing: border-box; }

        .maintenance-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            overflow: hidden;
            z-index: 0;
        }
        .maintenance-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(249,178,56,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(233,122,67,0.1) 0%, transparent 50%);
        }

        .maintenance-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(249,178,56,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249,178,56,0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 25s linear infinite;
            perspective: 500px;
        }
        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(55deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(55deg) translateY(50px); }
        }

        .maintenance-sparks span {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: rgba(249,178,56,0.6);
            animation: sparkGlow ease-in-out infinite;
            pointer-events: none;
        }
        .maintenance-sparks span:nth-child(1)  { left:15%; top:20%; animation-duration:2s;  animation-delay:0s; }
        .maintenance-sparks span:nth-child(2)  { left:80%; top:30%; animation-duration:2.5s; animation-delay:0.3s; }
        .maintenance-sparks span:nth-child(3)  { left:45%; top:15%; animation-duration:1.8s; animation-delay:0.6s; }
        .maintenance-sparks span:nth-child(4)  { left:25%; top:70%; animation-duration:2.2s; animation-delay:0.9s; }
        .maintenance-sparks span:nth-child(5)  { left:75%; top:80%; animation-duration:1.5s; animation-delay:1.2s; }
        .maintenance-sparks span:nth-child(6)  { left:55%; top:45%; animation-duration:2.8s; animation-delay:0.5s; }
        .maintenance-sparks span:nth-child(7)  { left:30%; top:55%; animation-duration:1.9s; animation-delay:1.5s; }
        .maintenance-sparks span:nth-child(8)  { left:90%; top:60%; animation-duration:2.3s; animation-delay:0.8s; }
        @keyframes sparkGlow {
            0%,100% { opacity:0.2; transform: scale(1); }
            50%     { opacity:1;   transform: scale(1.5); }
        }

        .maintenance-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .maintenance-container {
            text-align: center;
            max-width: 500px;
            animation: containerIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        @keyframes containerIn {
            from { opacity:0; transform: translateY(30px) scale(0.96); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }

        .maintenance-icon-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
        }
        .maintenance-icon {
            width: 120px; height: 120px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(249,178,56,0.15), rgba(233,122,67,0.1));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(249,178,56,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: #f9b238;
            animation: iconPulse 3s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(249,178,56,0.2);
        }
        @keyframes iconPulse {
            0%,100% { box-shadow: 0 0 40px rgba(249,178,56,0.2); transform: scale(1); }
            50%     { box-shadow: 0 0 60px rgba(249,178,56,0.4); transform: scale(1.02); }
        }
        .maintenance-icon i {
            animation: wrenchSpin 4s linear infinite;
        }
        @keyframes wrenchSpin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .maintenance-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9b238, #e97a43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .maintenance-subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .maintenance-desc {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.45);
            line-height: 1.8;
            margin-bottom: 32px;
        }
        .maintenance-desc i {
            color: rgba(249,178,56,0.5);
            margin: 0 4px;
        }

        .maintenance-status {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 32px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .maintenance-status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.88rem;
        }
        .maintenance-status-item:last-child {
            margin-bottom: 0;
        }
        .maintenance-status-label {
            color: rgba(255,255,255,0.5);
        }
        .maintenance-status-value {
            color: #f9b238;
            font-weight: 600;
        }
        .maintenance-status-value.online {
            color: #43e97b;
        }

        .maintenance-progress {
            margin-top: 16px;
        }
        .maintenance-progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .maintenance-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f9b238, #e97a43);
            border-radius: 3px;
            animation: progressFill 2s ease-out forwards;
            width: 0;
        }
        @keyframes progressFill {
            to { width: var(--progress, 65%); }
        }
        .maintenance-progress-text {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            text-align: right;
            margin-top: 6px;
        }

        .maintenance-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-maintenance {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            cursor: pointer;
            border: none;
        }
        .btn-maintenance.primary {
            background: linear-gradient(135deg, #f9b238, #e97a43);
            color: #fff;
            box-shadow: 0 4px 20px rgba(249,178,56,0.35);
        }
        .btn-maintenance.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(249,178,56,0.5);
        }
        .btn-maintenance.secondary {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
        }
        .btn-maintenance.secondary:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
            transform: translateY(-3px);
        }

        .maintenance-tip {
            margin-top: 40px;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0;
            animation: tipIn 1s ease 1s forwards;
        }
        @keyframes tipIn { to { opacity: 1; } }
        .maintenance-tip i { font-size: 0.7rem; }

        .maintenance-fog {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(180deg, transparent, rgba(26,26,46,0.6));
            pointer-events: none;
            z-index: 0;
        }

        .maintenance-footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .maintenance-page { padding: 40px 20px; }
            .maintenance-desc { font-size: 0.88rem; }
            .btn-maintenance { padding: 10px 22px; font-size: 13px; width: 100%; max-width: 260px; justify-content: center; }
            .maintenance-actions { flex-direction: column; align-items: center; }
            .maintenance-icon { width: 100px; height: 100px; font-size: 48px; }
        }
    </style>
</head>
<body>

    <div class="maintenance-bg">
        <div class="maintenance-grid"></div>
        <div class="maintenance-sparks">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
    </div>
    <div class="maintenance-fog"></div>

    <div class="maintenance-page">
        <div class="maintenance-container">
            <div class="maintenance-icon-wrap">
                <div class="maintenance-icon">
                    <i class="fas fa-wrench"></i>
                </div>
            </div>

            <h1 class="maintenance-title">维护中</h1>
            <h2 class="maintenance-subtitle">服务器正在进行例行维护</h2>

            <p class="maintenance-desc">
                我们正在对服务器进行升级和优化，以提供更好的游戏体验。<br>
                预计维护时间约为 <strong>1-2 小时</strong>，请稍后再试。<br>
                <i class="fas fa-clock"></i> <i class="fas fa-tools"></i> <i class="fas fa-server"></i>
            </p>

            <div class="maintenance-status">
                <div class="maintenance-status-item">
                    <span class="maintenance-status-label">服务器状态</span>
                    <span class="maintenance-status-value">维护中</span>
                </div>
                <div class="maintenance-status-item">
                    <span class="maintenance-status-label">预计恢复</span>
                    <span class="maintenance-status-value">约 1-2 小时后</span>
                </div>
                <div class="maintenance-status-item">
                    <span class="maintenance-status-label">官网状态</span>
                    <span class="maintenance-status-value online">正常运行</span>
                </div>

                <div class="maintenance-progress">
                    <div class="maintenance-progress-bar">
                        <div class="maintenance-progress-fill"></div>
                    </div>
                    <div class="maintenance-progress-text">维护进度：65%</div>
                </div>
            </div>

            <div class="maintenance-actions">
                <a href="../index.html" class="btn-maintenance primary"><i class="fas fa-home"></i> 返回首页</a>
                <button class="btn-maintenance secondary" onclick="location.reload()"><i class="fas fa-redo"></i> 刷新重试</button>
            </div>

            <div class="maintenance-tip">
                <i class="fas fa-info-circle"></i> 维护期间无法登录游戏，感谢您的理解与耐心等待
            </div>
        </div>
    </div>

    <div class="maintenance-footer">
        © 2026 万驹同源 Minecraft 服务器
    </div>

    <script>
        var config = {
            title: '维护中',
            subtitle: '服务器正在进行例行维护',
            description: '我们正在对服务器进行升级和优化，以提供更好的游戏体验。',
            estimatedTime: '约 1-2 小时后',
            progress: 65,
            progressText: '维护进度：65%'
        };

        function updateConfig(newConfig) {
            config = { ...config, ...newConfig };
            document.querySelector('.maintenance-title').textContent = config.title;
            document.querySelector('.maintenance-subtitle').textContent = config.subtitle;
            document.querySelector('.maintenance-status-value:nth-child(2)').textContent = config.estimatedTime;
            document.querySelector('.maintenance-progress-fill').style.setProperty('--progress', config.progress + '%');
            document.querySelector('.maintenance-progress-text').textContent = config.progressText;
        }
    </script>
</body>
</html>
