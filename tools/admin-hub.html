<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理总站 - 万驹同源</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS 变量（主题系统）*/
        :root {
            --bg-body: #f0f2f5;
            --bg-sidebar: #001529;
            --bg-sidebar-hover: rgba(255, 255, 255, 0.08);
            --bg-sidebar-active: #1890ff;
            --bg-header: rgba(255, 255, 255, 0.85);
            --bg-card: #ffffff;
            --bg-card-hover: #fafafa;
            --bg-stat: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #333;
            --text-tertiary: #666;
            --text-muted: #999;
            --text-sidebar: rgba(255, 255, 255, 0.65);
            --text-sidebar-active: #ffffff;
            --border-color: #e8e8e8;
            --border-light: #f0f0f0;
            --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
            --accent: #1890ff;
            --accent-hover: #40a9ff;
            --success: #52c41a;
            --warning: #faad14;
            --danger: #f5222d;
            --sidebar-width: 240px;
            --header-height: 56px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        [data-theme="dark"] {
            --bg-body: #141414;
            --bg-sidebar: #1f1f1f;
            --bg-sidebar-hover: rgba(255, 255, 255, 0.06);
            --bg-sidebar-active: #1890ff;
            --bg-header: rgba(30, 30, 30, 0.9);
            --bg-card: #1f1f1f;
            --bg-card-hover: #2a2a2a;
            --bg-stat: #1f1f1f;
            --text-primary: #e8e8e8;
            --text-secondary: #d0d0d0;
            --text-tertiary: #989898;
            --text-muted: #686868;
            --text-sidebar: rgba(255, 255, 255, 0.55);
            --text-sidebar-active: #ffffff;
            --border-color: #303030;
            --border-light: #262626;
            --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.2);
            --shadow-elevated: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font-sans);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /*侧边栏*/
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
        }

        .sidebar-brand {
            height: var(--header-height);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .sidebar-brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1890ff, #096dd9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .sidebar-brand-text {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .nav-section {
            padding: 0 12px;
            margin-top: 8px;
        }

        .nav-section:first-child {
            margin-top: 0;
        }

        .nav-section-title {
            padding: 8px 12px 6px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.3);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-sidebar);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            margin-bottom: 1px;
        }

        .nav-item i {
            width: 18px;
            font-size: 14px;
            text-align: center;
        }

        .nav-item:hover {
            background: var(--bg-sidebar-hover);
            color: var(--text-sidebar-active);
        }

        .nav-item.active {
            background: var(--bg-sidebar-active);
            color: white;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .sidebar-user:hover {
            background: var(--bg-sidebar-hover);
        }

        .sidebar-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1890ff, #096dd9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .sidebar-user-info {
            flex: 1;
            min-width: 0;
        }

        .sidebar-user-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sidebar-active);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-user-role {
            font-size: 11px;
            color: var(--text-sidebar);
        }

        .sidebar-logout {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-sidebar);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .sidebar-logout:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--danger);
        }

        /*主内容区*/
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        /*顶部栏*/
        .topbar {
            height: var(--header-height);
            flex-shrink: 0;
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: background 0.3s, border 0.3s;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-menu-btn {
            display: none;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .topbar-menu-btn:hover {
            background: var(--border-light);
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .topbar-breadcrumb {
            font-size: 12px;
            color: var(--text-muted);
        }

        .topbar-breadcrumb span {
            color: var(--text-tertiary);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .topbar-btn:hover {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .topbar-btn.profile-btn {
            width: auto;
            padding: 0 14px;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
            border: 1px solid rgba(102,126,234,0.2);
            color: var(--accent);
        }
        .topbar-btn.profile-btn:hover {
            background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
            border-color: rgba(102,126,234,0.4);
        }

        /*内容区*/
        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            min-height: 0;
            animation: pageEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .page-content::-webkit-scrollbar { width:6px; }
        .page-content::-webkit-scrollbar-track { background:transparent; }
        .page-content::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:3px; }

        @keyframes pageEnter {
            from { opacity:0; transform:translateY(12px); }
            to { opacity:1; transform:translateY(0); }
        }

        /*通用动画*/
        @keyframes cardIn { from { opacity:0; transform:translateY(16px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
        .card-enter { animation:cardIn 0.4s cubic-bezier(0.16,1,0.3,1) both; }
        .card-enter:nth-child(2) { animation-delay:0.06s; }
        .card-enter:nth-child(3) { animation-delay:0.10s; }
        .card-enter:nth-child(4) { animation-delay:0.14s; }

        /*AI 助手 markdown 渲染样式*/
        #aiChatMessages .ai-md { white-space: normal; word-break: break-word; }
        #aiChatMessages .ai-md > *:first-child { margin-top: 0; }
        #aiChatMessages .ai-md > *:last-child { margin-bottom: 0; }
        #aiChatMessages .ai-md p { margin: 6px 0; }
        #aiChatMessages .ai-md h1, #aiChatMessages .ai-md h2, #aiChatMessages .ai-md h3, #aiChatMessages .ai-md h4, #aiChatMessages .ai-md h5, #aiChatMessages .ai-md h6 { margin: 10px 0 6px; line-height: 1.3; font-weight: 600; color: var(--text-primary); }
        #aiChatMessages .ai-md h1 { font-size: 18px; }
        #aiChatMessages .ai-md h2 { font-size: 16px; }
        #aiChatMessages .ai-md h3 { font-size: 15px; }
        #aiChatMessages .ai-md h4, #aiChatMessages .ai-md h5, #aiChatMessages .ai-md h6 { font-size: 14px; }
        #aiChatMessages .ai-md ul, #aiChatMessages .ai-md ol { margin: 6px 0; padding-left: 22px; }
        #aiChatMessages .ai-md li { margin: 3px 0; }
        #aiChatMessages .ai-md a { color: var(--accent); text-decoration: underline; }
        #aiChatMessages .ai-md strong { font-weight: 700; color: var(--text-primary); }
        #aiChatMessages .ai-md em { font-style: italic; }
        #aiChatMessages .ai-md code { background: rgba(99,110,130,.18); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        #aiChatMessages .ai-md pre { background: #0f1320; color: #cfe3ff; padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid rgba(255,255,255,.06); }
        #aiChatMessages .ai-md pre code { background: transparent; padding: 0; color: inherit; font-size: 12.5px; }
        #aiChatMessages .ai-md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: rgba(99,110,130,.10); color: var(--text-secondary); border-radius: 0 6px 6px 0; }
        #aiChatMessages .ai-md hr { border: none; border-top: 1px solid var(--border-color); margin: 10px 0; }
        #aiChatMessages .ai-md table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12.5px; overflow: hidden; border-radius: 8px; }
        #aiChatMessages .ai-md th, #aiChatMessages .ai-md td { border: 1px solid var(--border-color); padding: 5px 9px; text-align: left; }
        #aiChatMessages .ai-md th { background: var(--border-light); font-weight: 600; color: var(--text-secondary); }
        #aiChatMessages .tool-result-card { width:100%; max-width:96%; }
        #aiChatMessages .tool-result-card details { background:var(--bg-body); border:1px solid var(--border-color); border-radius:10px; overflow:hidden; }
        #aiChatMessages .tool-result-card summary { cursor:pointer; padding:8px 12px; font-size:12.5px; color:var(--text-secondary); user-select:none; list-style:none; }
        #aiChatMessages .tool-result-card summary::-webkit-details-marker { display:none; }
        #aiChatMessages .tool-result-card summary:hover { color:var(--text-primary); background:rgba(99,110,130,.06); }
        #aiChatMessages .tool-result-card summary::before { content:'▶'; display:inline-block; margin-right:8px; font-size:9px; transition:transform .2s ease; color:var(--accent); }
        #aiChatMessages .tool-result-card details[open] > summary::before { transform:rotate(90deg); }
        #aiChatMessages .tool-result-json { margin:0; padding:12px 14px; max-height:340px; overflow:auto; background:#0f1320; color:#cfe3ff; font-size:12px; line-height:1.55; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; border-top:1px solid var(--border-color); white-space:pre; }
        .admin-table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; border-radius:8px; overflow:hidden; border:1px solid var(--border-color); }
        .admin-table thead th { padding:10px 14px; text-align:left; font-weight:600; background:var(--border-light); color:var(--text-secondary); border-bottom:1px solid var(--border-color); font-size:12px; white-space:nowrap; }
        .admin-table tbody tr { transition:background 0.15s; }
        .admin-table tbody tr:hover { background:rgba(24,144,255,0.03); }
        .admin-table tbody td { padding:9px 14px; border-bottom:1px solid var(--border-light); color:var(--text-tertiary); }
        .admin-table tbody tr:last-child td { border-bottom:none; }

        .card-lift { transition:transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s ease; }
        .card-lift:hover { transform:translateY(-3px); box-shadow:var(--shadow-elevated); }

        @keyframes shimmer { 0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0} }
        .skeleton { background:linear-gradient(90deg,var(--border-light) 25%,var(--bg-card) 50%,var(--border-light) 75%); background-size:200px 100%; animation:shimmer 1.5s infinite; border-radius:6px; }

        /*Dashboard 统计卡片*/
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-stat);
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            transition: box-shadow 0.2s, transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-elevated);
            transform: translateY(-2px);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .stat-card.users::after {
            background: linear-gradient(90deg, #1890ff, #40a9ff);
        }

        .stat-card.posts::after {
            background: linear-gradient(90deg, #52c41a, #73d13d);
        }

        .stat-card.replies::after {
            background: linear-gradient(90deg, #fa8c16, #ffa940);
        }

        .stat-card.images::after {
            background: linear-gradient(90deg, #722ed1, #9254de);
        }

        .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .stat-icon.users {
            background: #e6f7ff;
            color: #1890ff;
        }

        .stat-icon.posts {
            background: #f6ffed;
            color: #52c41a;
        }

        .stat-icon.replies {
            background: #fff7e6;
            color: #fa8c16;
        }

        .stat-icon.images {
            background: #f9f0ff;
            color: #722ed1;
        }

        [data-theme="dark"] .stat-icon.users {
            background: rgba(24, 144, 255, 0.15);
        }

        [data-theme="dark"] .stat-icon.posts {
            background: rgba(82, 196, 26, 0.15);
        }

        [data-theme="dark"] .stat-icon.replies {
            background: rgba(250, 140, 22, 0.15);
        }

        [data-theme="dark"] .stat-icon.images {
            background: rgba(114, 46, 209, 0.15);
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        /* 服务器管理概览卡片：点击即刷新（仅作用于 #svOverview，不影响站点仪表盘） */
        #svOverview .stat-card { cursor: pointer; user-select: none; }
        #svOverview .stat-card:hover {
            box-shadow: var(--shadow-elevated), 0 0 0 2px var(--accent);
            transform: translateY(-2px);
        }
        #svOverview .stat-card:active { transform: translateY(0); }
        #svOverview.refreshing .stat-icon {
            animation: svCardPulse 0.9s ease-in-out infinite;
        }
        @keyframes svCardPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.14); opacity: 0.55; }
        }

        .stat-change {
            font-size: 12px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .dashboard-modules {
            margin-bottom: 28px;
        }

        .dashboard-modules .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .dashboard-modules .section-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .dashboard-modules .section-header .count {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--border-light);
            padding: 2px 10px;
            border-radius: 10px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .module-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .module-card:hover {
            box-shadow: var(--shadow-elevated);
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .module-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .module-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .module-icon.blue {
            background: #e6f7ff;
            color: #1890ff;
        }

        .module-icon.green {
            background: #f6ffed;
            color: #52c41a;
        }

        .module-icon.orange {
            background: #fff7e6;
            color: #fa8c16;
        }

        .module-icon.purple {
            background: #f9f0ff;
            color: #722ed1;
        }

        .module-icon.red {
            background: #fff1f0;
            color: #f5222d;
        }

        .module-icon.cyan {
            background: #e6fffb;
            color: #13c2c2;
        }

        .module-icon.gold {
            background: #fffbe6;
            color: #d48806;
        }

        .module-icon.pink {
            background: #fff0f6;
            color: #eb2f96;
        }

        [data-theme="dark"] .module-icon.blue {
            background: rgba(24, 144, 255, 0.15);
        }

        [data-theme="dark"] .module-icon.green {
            background: rgba(82, 196, 26, 0.15);
        }

        [data-theme="dark"] .module-icon.orange {
            background: rgba(250, 140, 22, 0.15);
        }

        [data-theme="dark"] .module-icon.purple {
            background: rgba(114, 46, 209, 0.15);
        }

        [data-theme="dark"] .module-icon.red {
            background: rgba(245, 34, 45, 0.15);
        }

        [data-theme="dark"] .module-icon.cyan {
            background: rgba(19, 194, 194, 0.15);
        }

        [data-theme="dark"] .module-icon.gold {
            background: rgba(212, 136, 6, 0.15);
        }

        [data-theme="dark"] .module-icon.pink {
            background: rgba(235, 47, 150, 0.15);
        }

        .module-info {
            flex: 1;
            min-width: 0;
        }

        .module-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .module-desc {
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .module-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-light);
        }

        .module-btn {
            flex: 1;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;

    <script>
        // ── 全局状态 ──────────────────────────────────
        const STORE = { currentPage: 'dashboard', loadedStyles: new Set() };

        // ── MCP 客户端单例 ──────────────────────────────
        const McpClient = {
            initialized: false, headers: {},
            async init() {
                if (this.initialized) return;
                this.headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '') };
                const resp = await fetch('../mcp/mcp-server.php', {
                    method: 'POST', headers: this.headers,
                    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-03-26', auth_token: localStorage.getItem('authToken') || '' } })
                });
                const rawText = await resp.text();
                let d;
                try {
                    d = JSON.parse(rawText);
                } catch (parseErr) {
                    const preview = rawText.trim().substring(0, 300);
                    throw new Error(`MCP 初始化失败 (HTTP ${resp.status}): ${preview || '(空响应)'}`);
                }
                if (d.error) throw new Error(d.error.message || 'MCP 初始化失败');
                this.initialized = true;
                return d;
            },
            async request(method, params = {}) {
                await this.init();
                const resp = await fetch('../mcp/mcp-server.php', {
                    method: 'POST', headers: this.headers,
                    body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method, params: { ...params, auth_token: localStorage.getItem('authToken') || '' } })
                });
                const rawText = await resp.text();
                let d;
                try {
                    d = JSON.parse(rawText);
                } catch (parseErr) {
                    const preview = rawText.trim().substring(0, 300);
                    throw new Error(`MCP 返回非 JSON 响应 (HTTP ${resp.status}): ${preview || '(空响应)'}`);
                }
                if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
                return d;
            },
            async listTools() {
                const d = await this.request('tools/list', {});
                return d.result?.tools || [];
            },
            async callTool(name, args) {
                const d = await this.request('tools/call', { name, arguments: args });
                const text = d.result?.content?.[0]?.text;
                return text ? JSON.parse(text) : d.result;
            }
        };

        // ── 页面路由 ──────────────────────────────────
        const PAGES = {

        // ── 导航 ──────────────────────────────────────
        async function navigate(pageName) {
            try {
                if (svRefreshTimer) {
                    clearInterval(svRefreshTimer);
                    svRefreshTimer = null;
                }
                const page = PAGES[pageName];
                if (!page) return;

                // 外部链接：直接跳转
                if (page.external && !page.render) {
                    window.open(page.external, '_blank');
                    return;
                }

                // 更新导航激活状态
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.querySelector(`.nav-item[data-page="${pageName}"]`)?.classList.add('active');

                // 更新顶栏
                document.getElementById('pageTitle').textContent = page.title;
                document.getElementById('pageBreadcrumb').innerHTML = '首页 / <span>' + page.title + '</span>';

                // 更新 URL hash
                history.pushState(null, '', '#/' + pageName);
                STORE.currentPage = pageName;

                // 渲染
                const content = document.getElementById('pageContent');
                content.innerHTML = '<div class="page-loading"><div class="spinner"></div><span>加载中...</span></div>';

                if (page.render) {
                    await page.render(page, content);
                }

                // 移动端关闭侧栏
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');

        function svStartAutoRefresh() {
            if (svRefreshTimer) clearInterval(svRefreshTimer);
            svRefreshTimer = setInterval(() => {
                if (STORE.currentPage !== 'server') {
                    clearInterval(svRefreshTimer);
                    svRefreshTimer = null;
                    return;
                }
                svLoadData();
            }, 10000);
        }

        const ServerModule = { dashboard: null, instances: [] };
        let svRefreshTimer = null;
        let svLoading = false;

        async function svCallMcp(method, args = {}) {
            return McpClient.callTool(method, args);
        }

        async function svLoadData() {
            if (svLoading) return;
            svLoading = true;
            const rt = document.getElementById('svRefreshTime');
            if (rt) rt.textContent = '刷新中...';
            const ov = document.getElementById('svOverview');
            if (ov) ov.classList.add('refreshing');
            try {
                // 并行拉取：真实系统资源(system.php) + 真实玩家状态(mcstatus.php) + MCSM 面板概览
                // 三路互不阻塞：即使 MCP 未连接，真实数据仍可正常显示（与官网状态页同源）
                const [sysRes, mcRes, dashRes] = await Promise.allSettled([
                    fetch('../api/system.php').then(r => r.json()).catch(() => null),
                    fetch('../api/mcstatus.php').then(r => r.json()).catch(() => null),
                    svCallMcp('get_dashboard').catch(() => null)
                ]);

                // 1) CPU / 内存使用率 —— 与官网状态页同源（system.php 真实采集）
                if (sysRes.status === 'fulfilled' && sysRes.value && sysRes.value.success) {
                    document.getElementById('svCpu').textContent = (sysRes.value.cpu ?? '-') + '%';
                    document.getElementById('svMem').textContent = (sysRes.value.memory ?? '-') + '%';
                } else {
                    document.getElementById('svCpu').textContent = '-';
                    document.getElementById('svMem').textContent = '-';
                }

                // 2) 在线玩家 —— 与官网状态页同源（mcstatus.php 真实 MC 服务器状态）
                if (mcRes.status === 'fulfilled' && mcRes.value) {
                    const p = mcRes.value.players || {};
                    document.getElementById('svPlayers').textContent = (p.online ?? 0) + ' / ' + (p.max ?? 0);
                } else {
                    document.getElementById('svPlayers').textContent = '-';
                }

                // 3) MCSM 面板专属：实例数 / 运行时间（管理后台独有，status.html 不含）
                if (dashRes.status === 'fulfilled' && dashRes.value) {
                    const dash = dashRes.value;
                    ServerModule.dashboard = dash;
                    const inst = dash.instances || {};
                    document.getElementById('svInstances').textContent = (inst.running || 0) + ' / ' + (inst.total || 0);
                    document.getElementById('svUptime').textContent = dash.uptime || '-';
                } else {
                    document.getElementById('svInstances').textContent = '-';
                    document.getElementById('svUptime').textContent = '-';
                }

                // 加载实例列表（MCSM 专属，失败不影响上面的真实数据）
                try {
                    const list = await svCallMcp('list_instances', { page: 1, page_size: 50 });
                    ServerModule.instances = list.instances || list.data?.instances || [];
                } catch (e) {
                    console.warn('实例列表加载失败（不影响概览真实数据）:', e);
                    ServerModule.instances = [];
                }
                svRenderInstances();

                if (rt) rt.textContent = new Date().toLocaleTimeString();
            } catch (e) {
                if (rt) rt.textContent = '刷新失败 ' + new Date().toLocaleTimeString();
                console.error('服务器管理页刷新失败:', e);
            } finally {
                svLoading = false;
                const ov = document.getElementById('svOverview');
                if (ov) ov.classList.remove('refreshing');
            }
        }

        function svRenderInstances() {
            const el = document.getElementById('svInstanceList');
            if (!ServerModule.instances.length) {
                el.innerHTML = '<div style="class="panel-empty" style="">暂无实例</div>';
                return;
            }
            el.innerHTML = `<table class="admin-table" style="min-width:800px;">
                <thead><tr>
                    <th style="width:30px;"></th>
                    <th>实例名称</th>
                    <th style="width:90px;">状态</th>
                    <th style="width:80px;">玩家</th>
                    <th style="width:80px;" title="MCSManager 上报的进程 CPU 占用率。服务器空闲时接近 0%，属正常现象。">CPU</th>
                    <th style="width:90px;" title="MCSManager 上报的进程内存，通常为启动器/守护进程占用，并非 Java 实际堆内存，仅供参考。">内存</th>
                    <th style="width:70px;">版本</th>
                    <th style="width:160px;">操作</th>
                </tr></thead>
                <tbody>${ServerModule.instances.map(svRenderInstanceRow).join('')}</tbody>
            </table>`;
        }
        function svRenderInstanceRow(inst) {
            const status = inst.status_code ?? (inst.status === '运行中' ? 3 : 0);
            const statusMap = {
                0: { label: '已停止', color: 'var(--text-muted)', icon: 'fa-stop-circle' },
                1: { label: '启动中', color: 'var(--warning)', icon: 'fa-spinner fa-spin' },
                2: { label: '停止中', color: 'var(--warning)', icon: 'fa-spinner fa-spin' },
                3: { label: '运行中', color: 'var(--success)', icon: 'fa-play-circle' },
                4: { label: '异常', color: 'var(--danger)', icon: 'fa-exclamation-circle' }
            };
            const s = statusMap[status] || statusMap[0];
            const proc = inst.process || {};
            const pl = inst.players || {};
            const running = status === 3;
            const name = inst.name || inst.config?.name || '未知';
            const uuid = inst.uuid || inst.config?.uuid || '';
            const daemonId = inst.daemonId || '';

            return `<tr>
                <td><i class="fas ${s.icon}" style="color:${s.color};font-size:14px;"></i></td>
                <td style="font-weight:500;color:var(--text-primary);">${escHtml(name)}</td>
                <td><span class="badge" style="background:${s.color}15;color:${s.color};">${s.label}</span></td>
                <td>${pl.current ?? '-'}/${pl.max ?? '-'}</td>
                <td>${proc.cpu != null ? proc.cpu + '%' : '-'}</td>
                <td>${proc.memory || '-'}</td>
                <td style="font-size:11px;">${inst.version || '-'}</td>
                <td>
                    <div style="display:flex;gap:4px;flex-wrap:nowrap;">
                        ${running ? `<button class="nt-btn secondary" onclick="svControl('stop','${escHtml(uuid)}','${escHtml(daemonId)}','${escHtml(name)}')" style="padding:4px 8px;font-size:11px;" title="停止"><i class="fas fa-stop"></i></button>
                        <button class="nt-btn secondary" onclick="svControl('restart','${escHtml(uuid)}','${escHtml(daemonId)}','${escHtml(name)}')" style="padding:4px 8px;font-size:11px;" title="重启"><i class="fas fa-sync-alt"></i></button>` :
                        `<button class="nt-btn primary" onclick="svControl('start','${escHtml(uuid)}','${escHtml(daemonId)}','${escHtml(name)}')" style="padding:4px 8px;font-size:11px;" title="启动"><i class="fas fa-play"></i></button>`}
                        <button class="nt-btn secondary" onclick="svViewLog('${escHtml(uuid)}','${escHtml(daemonId)}','${escHtml(name)}')" style="padding:4px 8px;font-size:11px;" title="日志"><i class="fas fa-terminal"></i></button>
                    </div>
                </td>
            </tr>`;
        }

        async function svControl(action, uuid, daemonId, name) {
            if (!confirm(`确定要${action === 'start' ? '启动' : action === 'stop' ? '停止' : '重启'}「${name}」吗？`)) return;
            try {
                const result = await svCallMcp(action + '_instance', { uuid, daemonId });
                showToast(result.message || result.success ? '操作已发送' : '操作失败', result.success ? 'success' : 'error');
                setTimeout(svLoadData, 1500);
            } catch(e) {
                showToast('操作失败: ' + e.message, 'error');
            }
        }

        async function svViewLog(uuid, daemonId, name) {
            try {
                const result = await svCallMcp('get_instance_log', { uuid, daemonId, size: 512 });
                const log = result.log || '暂无日志';
                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;justify-content:center;align-items:center;';
                overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

                    <div style="padding:14px 18px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;">

                        <button onclick="this.closest('div[style]').parentElement.remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);">&times;</button>
                    </div>
                    <div style="flex:1;overflow-y:auto;padding:16px;"><pre style="background:#1a1a2e;color:#a0d2ff;padding:16px;border-radius:8px;font-size:12px;line-height:1.6;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:0;max-height:400px;">${escHtml(log)}</pre></div>
                </div>`;
                document.body.appendChild(overlay);
            } catch(e) {
                showToast('获取日志失败: ' + e.message, 'error');

        function ntFsOnInput() {

        function ntMdAction(ta, type) {
            if (!ta) return;
            const start = ta.selectionStart, end = ta.selectionEnd, val = ta.value;
            const sel = val.slice(start, end);
            let before = '', after = '', placeholder = '', linePrefix = null;
            if (type === 'bold') { before = '**'; after = '**'; placeholder = '粗体文字'; }
            else if (type === 'italic') { before = '*'; after = '*'; placeholder = '斜体文字'; }
            else if (type === 'code') { before = '`'; after = '`'; placeholder = '代码'; }
            else if (type === 'link') { before = '['; after = '](https://)'; placeholder = '链接文字'; }
            else if (type === 'h2') { linePrefix = '## '; }
            else if (type === 'ul') { linePrefix = '- '; }
            else if (type === 'ol') { linePrefix = '1. '; }
            else if (type === 'quote') { linePrefix = '> '; }
            else return;
            if (linePrefix !== null) {
                const lineStart = val.lastIndexOf('\n', start - 1) + 1;
                ta.value = val.slice(0, lineStart) + linePrefix + val.slice(lineStart);
                ta.selectionStart = ta.selectionEnd = end + linePrefix.length;
            } else {
                const text = sel || placeholder;
                ta.value = val.slice(0, start) + before + text + after + val.slice(end);
                ta.selectionStart = start + before.length;
                ta.selectionEnd = start + before.length + text.length;
            }
            ta.focus();
            ta.dispatchEvent(new Event('input'));
        }
        function ntBindMdToolbar() {

                if (btn.closest('#ntFsOverlay')) ta = document.getElementById('ntFsTextarea');
                else { const box = btn.closest('.nt-md-box'); ta = box ? box.querySelector('textarea') : null; }
                ntMdAction(ta, md);
            });
            window.__ntMdBound = true;
        }

        // ── 公告管理 JS ────────────────────────────
        const AnnounceModule = { data: { announcements: [] } };
        const NT_API = '../api/announcement.php';

        function ntApiFetch(url, opts = {}) {
            const token = localStorage.getItem('authToken');
            if (!opts.headers) opts.headers = {};
            opts.headers['Authorization'] = 'Bearer ' + (token || '');
            return fetch(url, opts);
        }

        function initAnnouncementTabs() {
            document.querySelectorAll('.nt-tab').forEach(tab => {
                tab.addEventListener('click', function () {
                    const tabId = this.getAttribute('data-ntab');
                    document.querySelectorAll('.nt-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.nt-panel').forEach(p => p.classList.remove('active'));
                    document.getElementById('nt-' + tabId).classList.add('active');
                    if (tabId === 'edit') updateAnnouncementEditSelect();
                });
            });
        }

        function ntShowStatus(type, msg, id = 'nt-status-list') {
            const el = document.getElementById(id);
            if (!el) return;
            el.className = 'nt-status show ' + type;
            el.textContent = msg;
            setTimeout(() => { el.className = 'nt-status'; el.textContent = ''; }, 3000);
        }

        function ntLoadAnnouncements() {
            ntApiFetch(NT_API).then(r => r.json()).then(d => {
                AnnounceModule.data = d.success && d.data && Array.isArray(d.data.announcements) ? d.data : { announcements: [] };
                renderAnnouncementList();
                updateAnnouncementEditSelect();
                ntShowStatus('success', '公告数据加载成功');
            }).catch(e => {
                AnnounceModule.data = { announcements: [] };
                renderAnnouncementList();
                updateAnnouncementEditSelect();
                ntShowStatus('error', '加载失败: ' + e.message);
            });
        }

        function renderAnnouncementList() {
            const list = document.getElementById('nt-announcementList');
            const items = Array.isArray(AnnounceModule.data.announcements) ? AnnounceModule.data.announcements : [];
            if (!items.length) { list.innerHTML = '<li style="class="panel-empty" style="">暂无公告</li>'; return; }
            list.innerHTML = items.map(a => `
    <li class="nt-item">
      <h3>${escHtml(a.title)}</h3>
      <div class="nt-meta">
        <span><i class="fas fa-tag"></i> ${escHtml(a.id)}</span>
        <span><i class="fas fa-folder"></i> ${escHtml(a.type)}</span>
        <span><i class="fas fa-user"></i> ${escHtml(a.author)}</span>
        <span><i class="fas fa-calendar"></i> ${escHtml(a.created_at)}</span>
        <span><i class="fas fa-eye"></i> ${a.views || 0}</span>
      </div>
      <p style="font-size:13px;color:var(--text-tertiary);">${escHtml(a.summary || '无摘要')}</p>
      <div class="nt-actions">
        <button class="nt-btn secondary" onclick="editAnnouncementById('${escHtml(a.id)}')"><i class="fas fa-edit"></i> 编辑</button>
        <button class="nt-btn danger" onclick="confirmAnnouncementDelete('${escHtml(a.id)}')"><i class="fas fa-trash"></i> 删除</button>
        <button class="nt-btn secondary" onclick="previewAnnouncementById('${escHtml(a.id)}')"><i class="fas fa-eye"></i> 预览</button>
      </div>
    </li>
  `).join('');
        }

        function updateAnnouncementEditSelect() {
            const sel = document.getElementById('nt-editSelect');
            sel.innerHTML = '<option value="">-- 选择公告 --</option>';
            (Array.isArray(AnnounceModule.data.announcements) ? AnnounceModule.data.announcements : []).forEach(a => {
                sel.innerHTML += `<option value="${escHtml(a.id)}">${escHtml(a.title)} (${escHtml(a.id)})</option>`;
            });
            sel.onchange = function () {
                const id = this.value;
                if (id) loadAnnouncementForEdit(id); else document.getElementById('nt-editForm').style.display = 'none';
            };
        }

        function loadAnnouncementForEdit(id) {
            ntApiFetch(NT_API + '?id=' + id).then(r => r.json()).then(d => {
                if (!d.success) throw new Error(d.message || '加载失败');
                const a = d.data;
                document.getElementById('nt-editId').value = a.id;
                document.getElementById('nt-editTitle').value = a.title;
                document.getElementById('nt-editType').value = a.type;
                document.getElementById('nt-editAuthor').value = a.author;
                document.getElementById('nt-editDate').value = a.created_at;
                document.getElementById('nt-editSummary').value = a.summary || '';
                document.getElementById('nt-editContent').value = a.content || '';
                document.getElementById('nt-editForm').style.display = 'block';
            }).catch(e => ntShowStatus('error', e.message, 'nt-status-edit'));
        }

        function editAnnouncementById(id) {
            document.querySelector('[data-ntab="edit"]').click();
            document.getElementById('nt-editSelect').value = id;
            document.getElementById('nt-editSelect').onchange();
        }

        function previewAnnouncementById(id) {
            ntApiFetch(NT_API + '?id=' + id).then(r => r.json()).then(d => {
                if (!d.success) throw new Error(d.message || '加载失败');
                document.querySelector('[data-ntab="preview"]').click();
                document.getElementById('nt-previewContent').value = d.data.content || '';
                previewAnnouncementMarkdown();
            }).catch(e => ntShowStatus('error', e.message));
        }

        function confirmAnnouncementDelete(id) {
            if (confirm('确定要删除这个公告吗？此操作不可恢复。')) {
                ntApiFetch(NT_API + '?id=' + id, { method: 'DELETE' }).then(r => r.json()).then(d => {
                    if (d.success) {
                        ntShowStatus('success', '公告删除成功');
                        ntLoadAnnouncements();
                        document.getElementById('nt-editForm').style.display = 'none';
                    } else throw new Error(d.message || '删除失败');
                }).catch(e => ntShowStatus('error', e.message));
            }
        }

        function deleteAnnouncement() {
            const id = document.getElementById('nt-editId').value;
            if (id) confirmAnnouncementDelete(id);
        }

        function previewAnnouncementMarkdown() {
            const md = document.getElementById('nt-previewContent').value;
            if (typeof marked !== 'undefined') {
                document.getElementById('nt-previewResult').innerHTML = marked.parse(md || '# 预览效果将显示在这里...');
            } else {
                document.getElementById('nt-previewResult').textContent = md || '（无法渲染 Markdown）';
            }
        }

        function clearAnnouncementPreview() {
            document.getElementById('nt-previewContent').value = '';
            document.getElementById('nt-previewResult').innerHTML = '预览效果将显示在这里...';
        }

        function resetAnnouncementAdd() {
            document.getElementById('nt-addForm').reset();
            document.getElementById('nt-addDate').valueAsDate = new Date();
        }

        function ntExportData() {
            const blob = new Blob([JSON.stringify(AnnounceModule.data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'announcements-backup.json';
            a.click(); URL.revokeObjectURL(url);
        }

        function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        // ── 添加公告表单提交 ────────────────────────
        document.addEventListener('submit', function (e) {
            const form = e.target;
            if (form.id !== 'nt-addForm' && form.id !== 'nt-editForm') return;
            e.preventDefault();

            const isEdit = form.id === 'nt-editForm';
            const prefix = isEdit ? 'nt-edit' : 'nt-add';
            const statusId = isEdit ? 'nt-status-edit' : 'nt-status-add';

            const data = {
                id: document.getElementById(prefix + 'Id').value,
                title: document.getElementById(prefix + 'Title').value,
                type: document.getElementById(prefix + 'Type').value,
                author: document.getElementById(prefix + 'Author').value,
                created_at: document.getElementById(prefix + 'Date').value,
                summary: document.getElementById(prefix + 'Summary').value,
                content: document.getElementById(prefix + 'Content').value
            };

            const method = isEdit ? 'PUT' : 'POST';
            const url = isEdit ? NT_API + '?id=' + data.id : NT_API;

            ntApiFetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
                .then(r => r.json()).then(d => {
                    if (d.success) {
                        ntShowStatus('success', isEdit ? '公告更新成功' : '公告添加成功', statusId);
                        ntLoadAnnouncements();
                        if (!isEdit) resetAnnouncementAdd();
                    } else throw new Error(d.message || '操作失败');
                }).catch(e => ntShowStatus('error', e.message, statusId));
        });

        // ── 发送通知 ──────────────────────────────────
        function renderNotifications(page, content) {
            content.innerHTML = pageHeader('fas fa-bell', '发送通知', '向全站发送系统通知、活动通知或更新通知', 'var(--warning)') + `
                <div style="background:var(--bg-card);border-radius:10px;border:1px solid var(--border-color);padding:24px;max-width:560px;">
                    <div id="ntf-status" style="padding:10px 14px;border-radius:6px;font-size:13px;font-weight:500;display:none;margin-bottom:16px;"></div>
                    <div class="nt-form-group"><label>通知标题</label><input type="text" id="ntf-title" placeholder="请输入通知标题"></div>
                    <div class="nt-form-group"><label>通知类型</label>
                        <select id="ntf-type"><option value="system">系统通知</option><option value="event">活动通知</option><option value="update">更新通知</option></select>
                    </div>
                    <div class="nt-form-group"><label>通知内容</label><textarea id="ntf-content" rows="6" placeholder="请输入通知内容"></textarea></div>
                    <div style="display:flex;gap:10px;">
                        <button class="nt-btn primary" onclick="sendNotificationNow()"><i class="fas fa-paper-plane"></i> 发送通知</button>
                        <button class="nt-btn secondary" onclick="resetNotificationForm()"><i class="fas fa-undo"></i> 重置表单</button>
                    </div>
                </div>`;
        }

        function setNtfStatus(type, msg) {
            const el = document.getElementById('ntf-status');
            if (!el) return;
            el.style.display = 'block';
            el.className = '';
            if (type === 'success') { el.style.cssText += 'background:rgba(82,196,26,0.1);color:var(--success);border:1px solid rgba(82,196,26,0.2);display:block;'; }
            else { el.style.cssText += 'background:rgba(245,34,45,0.1);color:var(--danger);border:1px solid rgba(245,34,45,0.2);display:block;'; }
            el.textContent = msg;
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function resetNotificationForm() {
            document.getElementById('ntf-title').value = '';
            document.getElementById('ntf-content').value = '';
            document.getElementById('ntf-type').value = 'system';
        }

        async function sendNotificationNow() {
            const title = document.getElementById('ntf-title').value.trim();
            const type = document.getElementById('ntf-type').value;
            const content = document.getElementById('ntf-content').value.trim();
            if (!title) { setNtfStatus('error', '请输入通知标题'); return; }
            if (!content) { setNtfStatus('error', '请输入通知内容'); return; }
            try {
                const token = localStorage.getItem('authToken');
                const r = await fetch('../api/send_notification.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ title, type, content })
                });
                const d = await r.json();
                if (d.success) { setNtfStatus('success', '通知发送成功'); resetNotificationForm(); }
                else setNtfStatus('error', d.message || '发送失败');
            } catch (e) { setNtfStatus('error', '网络错误: ' + e.message); }
        }

        // ── 数据库查询 ────────────────────────────────
        function renderDatabase(page, content) {
            content.innerHTML = pageHeader("fas fa-database", "数据库管理", "浏览、查询、编辑数据库表结构与数据", "var(--accent)", "<div id=\"dbInfo\" style=\"display:none;align-items:center;gap:8px;font-size:13px;color:var(--success);padding:8px 14px;background:rgba(82,196,26,0.08);border-radius:6px;\"><i class=\"fas fa-check-circle\"></i> 已连接: <strong id=\"dbName\" style=\"color:var(--text-primary);\"></strong></div><a id=\"dbBackupBtn\" href=\"../api/db_test.php?action=backup\" target=\"_blank\" class=\"nt-btn secondary\" style=\"text-decoration:none;font-size:12px;\"><i class=\"fas fa-archive\"></i> 备份数据库</a>") + `

                <div style="display:flex;gap:16px;">
                    <!-- 左侧：表列表 -->
                    <div style="width:280px;flex-shrink:0;background:var(--bg-card);border-radius:10px;border:1px solid var(--border-color);display:flex;flex-direction:column;max-height:600px;">
                        <div style="padding:14px 16px;border-bottom:1px solid var(--border-color);">
                            <h3 style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;"><i class="fas fa-table" style="color:var(--accent);margin-right:6px;"></i>数据表 <span id="dbTableCount" style="font-size:11px;color:var(--text-muted);font-weight:400;"></span></h3>
                            <input type="text" id="dbSearch" placeholder="搜索表名..." oninput="dbFilterTables(this.value)" style="width:100%;padding:7px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:12px;background:var(--bg-body);color:var(--text-primary);box-sizing:border-box;">
                        </div>
                        <div id="dbTableList" style="flex:1;overflow-y:auto;padding:8px;">
                            <div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">加载中...</div>
                        </div>
                    </div>

                    <!-- 右侧：详情 -->
                    <div style="flex:1;min-width:0;">
                        <div id="dbEmpty" style="background:var(--bg-card);border-radius:10px;border:1px solid var(--border-color);padding:60px 20px;text-align:center;color:var(--text-muted);">
                            <i class="fas fa-arrow-left" style="font-size:24px;display:block;margin-bottom:12px;opacity:0.4;"></i>
                            <span style="font-size:14px;">从左侧选择一个数据表查看详情</span>
                        </div>
                        <div id="dbDetail" style="display:none;">
                            <div style="background:var(--bg-card);border-radius:10px;border:1px solid var(--border-color);overflow:hidden;">
                                <div style="padding:14px 18px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                    <h3 id="dbDetailTitle" style="font-size:14px;font-weight:600;color:var(--text-primary);margin:0;"></h3>
                                    <div style="display:flex;gap:6px;">
                                        <button class="nt-btn secondary" onclick="dbExportCsv()" style="padding:5px 10px;font-size:11px;"><i class="fas fa-download"></i> 导出 CSV</button>
                                        <button class="nt-btn secondary" onclick="document.getElementById('dbDetail').style.display='none';document.getElementById('dbEmpty').style.display='block';" style="padding:5px 10px;font-size:11px;"><i class="fas fa-times"></i></button>
                                    </div>
                                </div>
                                <!-- Tab: 结构 / 数据 -->
                                <div style="display:flex;border-bottom:1px solid var(--border-color);background:var(--bg-body);">
                                    <button class="db-tab active" data-dbtab="structure" onclick="dbSwitchTab('structure')" style="flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--accent);border-bottom:2px solid var(--accent);transition:all 0.15s;"><i class="fas fa-list"></i> 表结构</button>
                                    <button class="db-tab" data-dbtab="data" onclick="dbSwitchTab('data')" style="flex:1;padding:10px;border:none;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-tertiary);border-bottom:2px solid transparent;transition:all 0.15s;"><i class="fas fa-table"></i> 数据记录</button>
                                </div>
                                <div id="dbStructure" style="padding:16px;display:block;"></div>
                                <div id="dbData" style="padding:16px;display:none;"></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            dbInit();
        }

        const DbModule = { tables: [], filtered: [], currentTable: "", page: 1, total: 0 };

        // 数据库 API 请求封装（自动携带 token）
        function dbFetch(url, opts = {}) {
            const token = localStorage.getItem('authToken');
            opts.headers = { ...(opts.headers || {}), 'Authorization': 'Bearer ' + token };
            return fetch(url, opts).then(r => r.json());
        }

        function dbInit() {
            // 备份按钮携带 token
            const tk = localStorage.getItem('authToken');
            const btn = document.getElementById('dbBackupBtn');
            if (btn && tk) btn.href = `../api/db_test.php?action=backup&token=${encodeURIComponent(tk)}`;

            dbFetch('../api/db_test.php').then(d => {
                if (!d.success) throw new Error(d.message);
                document.getElementById('dbInfo').style.display = 'flex';
                document.getElementById('dbName').textContent = d.data.database || 'unknown';
                DbModule.tables = d.data.tables || [];
                DbModule.filtered = [...DbModule.tables];
                dbRenderTableList();
            }).catch(e => {
                document.getElementById('dbTableList').innerHTML = `<div style="color:var(--danger);padding:20px;text-align:center;">${e.message}</div>`;
            });
        }

        function dbRenderTableList() {
            const el = document.getElementById('dbTableList');
            const count = document.getElementById('dbTableCount');
            count.textContent = `(${DbModule.filtered.length}/${DbModule.tables.length})`;
            if (!DbModule.filtered.length) {
                el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:12px;">无匹配表</div>';
                return;
            }
            el.innerHTML = DbModule.filtered.map(t => {
                const active = t === DbModule.currentTable;
                return `<div onclick="dbSelectTable('${t}')" style="padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:all 0.15s;font-size:13px;display:flex;align-items:center;gap:8px;${active ? 'background:rgba(24,144,255,0.1);color:var(--accent);font-weight:600;border-left:3px solid var(--accent);' : 'color:var(--text-primary);border-left:3px solid transparent;'}" onmouseover="this.style.background='var(--border-light)'" onmouseout="this.style.background='${active?'rgba(24,144,255,0.1)':''}'">
                    <i class="fas fa-table" style="font-size:12px;color:${active?'var(--accent)':'var(--accent)'}"></i> ${t}
                </div>`;
            }).join('');
        }

        function dbFilterTables(q) {
            const s = q.toLowerCase().trim();
            DbModule.filtered = s ? DbModule.tables.filter(t => t.toLowerCase().includes(s)) : [...DbModule.tables];
            dbRenderTableList();
        }

        function dbSelectTable(name) {
            DbModule.currentTable = name;
            dbRenderTableList();
            document.getElementById('dbEmpty').style.display = 'none';
            document.getElementById('dbDetail').style.display = 'block';
            document.getElementById('dbDetailTitle').innerHTML = `<i class="fas fa-table" style="color:var(--accent);margin-right:8px;"></i>${name}`;
            document.getElementById('dbStructure').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);">加载中...</div>';
            document.getElementById('dbData').innerHTML = '';
            dbSwitchTab('structure');

            dbFetch(`../api/db_test.php?action=get_table_structure&table=${name}`).then(d => {
                if (!d.success) throw new Error(d.message);
                const cols = d.data.structure || [];
                document.getElementById('dbStructure').innerHTML = cols.length ? `
                    <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead><tr><th>#</th><th>字段</th><th>类型</th><th>允许空</th><th>默认值</th><th>额外</th></tr></thead>
                        <tbody>${cols.map((r,i) => `<tr><td style="color:var(--text-muted);width:30px;">${i+1}</td><td style="font-weight:500;color:var(--text-primary);">${r.Field||'-'}</td><td><code style="background:var(--border-light);padding:2px 6px;border-radius:3px;font-size:11px;">${r.Type||'-'}</code></td><td>${r.Null||'NO'}</td><td>${r.Default??'-'}</td><td>${r.Extra||'-'}</td></tr>`).join('')}</tbody>
                    </table></div>
                    <div style="margin-top:8px;font-size:12px;color:var(--text-muted);">共 ${cols.length} 个字段</div>` : '<div style="padding:20px;text-align:center;color:var(--text-muted);">无结构信息</div>';
            }).catch(e => {
                document.getElementById('dbStructure').innerHTML = `<div style="color:var(--danger);padding:16px;">${e.message}</div>`;
            });

            DbModule.page = 1;
            dbLoadData();
        }

        function dbSwitchTab(tab) {
            document.querySelectorAll('.db-tab').forEach(t => {
                t.style.color = t.dataset.dbtab === tab ? 'var(--accent)' : 'var(--text-tertiary)';
                t.style.borderBottomColor = t.dataset.dbtab === tab ? 'var(--accent)' : 'transparent';
            });
            document.getElementById('dbStructure').style.display = tab === 'structure' ? 'block' : 'none';
            document.getElementById('dbData').style.display = tab === 'data' ? 'block' : 'none';
        }

        async function dbLoadData() {
            const el = document.getElementById('dbData');
            el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);">加载中...</div>';
            try {
                const dd = await dbFetch(`../api/db_test.php?action=get_table_data&table=${DbModule.currentTable}&page=${DbModule.page}&limit=15`);
                if (!dd.success) throw new Error(dd.message);
                const rows = dd.data.data || [];
                DbModule.total = dd.data.total || 0;
                if (!rows.length) { el.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-muted);">暂无数据</div>'; return; }
                const cols = Object.keys(rows[0]);
                const totalPages = Math.ceil(DbModule.total / 15);
                el.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
                        <div style="font-size:12px;color:var(--text-muted);">共 <strong style="color:var(--text-primary);">${DbModule.total}</strong> 条记录 · 第 ${DbModule.page}/${totalPages} 页</div>
                        <button class="nt-btn primary" onclick="dbOpenForm('add')" style="padding:5px 12px;font-size:12px;"><i class="fas fa-plus"></i> 添加行</button>
                    </div>
                    <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead><tr>${cols.map(c => `<th style="word-break:keep-all;">${c}</th>`).concat('<th style="width:80px;">操作</th>').join('')}</tr></thead>
                        <tbody>${rows.map(r => `<tr>${cols.map(c => `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(String(r[c]??''))}">${r[c]??'-'}</td>`).join('')}<td><div style="display:flex;gap:4px;"><button class="nt-btn secondary" onclick="dbOpenForm('edit',${JSON.stringify(r).replace(/"/g,'&quot;')})" style="padding:3px 8px;font-size:11px;" title="编辑"><i class="fas fa-pen"></i></button><button class="nt-btn danger" onclick="dbDeleteRow(${JSON.stringify(r).replace(/"/g,'&quot;')})" style="padding:3px 8px;font-size:11px;" title="删除"><i class="fas fa-trash"></i></button></div></td></tr>`).join('')}</tbody>

        function dbExportCsv() {
            if (!DbModule.currentTable) return;
            DbModule.page = 1;
            dbFetch(`../api/db_test.php?action=get_table_data&table=${DbModule.currentTable}&page=1&limit=10000`).then(d=>{
                if (!d.success) throw new Error(d.message);
                const rows = d.data.data || [];
                if (!rows.length) { showToast('暂无数据可导出','error'); return; }
                const cols = Object.keys(rows[0]);
                const csv = [cols.join(','), ...rows.map(r => cols.map(c => '"' + String(r[c]??'').replace(/"/g,'""') + '"').join(','))].join('\n');
                const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = DbModule.currentTable + '.csv';
                a.click(); URL.revokeObjectURL(url);
                showToast('导出成功','success');
            }).catch(e => showToast('导出失败: '+e.message,'error'));
        }

        const OrderModule = { timer: null, countdown: null, remaining: 0, processed: 0, errors: 0 };

        function initOrderUpdate() {
            document.getElementById('orderStatus').textContent = '就绪';
            document.getElementById('orderStatus').style.color = 'var(--text-muted)';
            document.getElementById('orderStatusDot').style.background = 'var(--text-muted)';
            addOrderLog('system', '系统就绪，等待操作');
        }

        function addOrderLog(type, msg) {
            const log = document.getElementById('orderLog');
            if (!log) return;
            const t = new Date().toLocaleTimeString();
            const colors = { system: 'var(--accent)', success: 'var(--success)', error: 'var(--danger)', info: 'var(--text-tertiary)' };
            const icons = { system: 'fa-info-circle', success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-circle' };
            log.innerHTML += `<div style="display:flex;align-items:center;gap:8px;padding:2px 0;animation:cardIn 0.2s ease;"><span style="font-size:11px;color:var(--text-muted);min-width:60px;">${t}</span><i class="fas ${icons[type]||icons.info}" style="color:${colors[type]||colors.info};font-size:10px;width:14px;"></i><span>${msg}</span></div>`;
            if (log.children.length > 80) log.removeChild(log.firstChild);
            log.scrollTop = log.scrollHeight;
        }

        function startOrderUpdate() {
            if (OrderModule.timer) return;
            OrderModule.timer = setInterval(async () => { await executeOrderUpdate(); }, 120000);
            OrderModule.remaining = 120;
            document.getElementById('orderStatus').textContent = '运行中';
            document.getElementById('orderStatus').style.color = 'var(--success)';
            document.getElementById('orderStatusDot').style.background = 'var(--success)';
            document.getElementById('OrderModule.countdown').style.display = 'block';
            addOrderLog('success', '自动更新已启动 (间隔 120 秒)');
            OrderModule.countdown = setInterval(() => {
                OrderModule.remaining--;
                document.getElementById('OrderModule.countdown').textContent = '下次更新: ' + OrderModule.remaining + 's';
                if (OrderModule.remaining <= 0) OrderModule.remaining = 120;
            }, 1000);
        }

        function stopOrderUpdate() {
            if (OrderModule.timer) { clearInterval(OrderModule.timer); OrderModule.timer = null; }
            if (OrderModule.countdown) { clearInterval(OrderModule.countdown); OrderModule.countdown = null; }
            document.getElementById('orderStatus').textContent = '已停止';
            document.getElementById('orderStatus').style.color = 'var(--text-muted)';
            document.getElementById('orderStatusDot').style.background = 'var(--text-muted)';
            document.getElementById('OrderModule.countdown').style.display = 'none';
            addOrderLog('error', '自动更新已停止');
        }

        async function manualOrderUpdate() {
            addOrderLog('info', '手动触发更新...');
            await executeOrderUpdate();
        }

        async function executeOrderUpdate() {
            try {
                const progress = document.getElementById('orderProgress');
                const bar = document.getElementById('orderProgressBar');
                progress.style.display = 'block';
                bar.style.width = '0%';

                addOrderLog('info', '正在执行更新...');
                // Animate progress
                let p = 0;
                const pi = setInterval(() => { p = Math.min(p + 5, 85); bar.style.width = p + '%'; }, 300);

                const r = await fetch('/api/aifadian/auto_update.php', {
                    method: 'GET',
                    headers: {
                        'X-Afdian-Key': '718ddbda84c5df5b083c3e58af059e92f85ba1aa8ffac769'
                    }
                });
                const d = await r.json();
                clearInterval(pi);

                if (d.success) {
                    document.getElementById('orderLastTime').textContent = new Date().toLocaleString();
                    const count = d.data?.processed_count || 0;
                    OrderModule.processed += count;
                    document.getElementById('orderProcessed').textContent = OrderModule.processed;
                    bar.style.width = '100%';
                    addOrderLog('success', `更新完成: 处理 ${count} 条`);
                    if (d.data?.updated_players?.length) {
                        d.data.updated_players.slice(0, 5).forEach(p => addOrderLog('info', `  ${p.username}: ${p.old_points}→${p.new_points} (+${p.added_points})`));
                    }
                    if (d.data?.errors?.length) {
                        d.data.errors.forEach(e => { OrderModule.errors++; addOrderLog('error', '  ' + e); });
                        document.getElementById('orderErrors').textContent = OrderModule.errors;
                    }
                } else {
                    OrderModule.errors++;
                    document.getElementById('orderErrors').textContent = OrderModule.errors;
                    addOrderLog('error', '更新失败: ' + (d.message || '未知错误'));
                }
                setTimeout(() => { progress.style.display = 'none'; bar.style.width = '0%'; }, 2000);
            } catch (e) {
                addOrderLog('error', '请求失败: ' + e.message);
                document.getElementById('orderProgress').style.display = 'none';
            }
        }

                            <button class="nt-btn primary" onclick="mailSend()"><i class="fas fa-paper-plane"></i> 发送邮件</button>

        // 加载用户列表（带邮箱的才可勾选）
        async function mailLoadUsers() {
            const el = document.getElementById('mailUserList');
            if (!el) return;
            try {
                const token = localStorage.getItem('authToken');
                const r = await fetch('../api/user_manager.php?action=list', { headers: { 'Authorization': 'Bearer ' + token } });
                const d = await r.json();
                const users = d.success ? (d.data?.users || []) : [];
                if (!users.length) { el.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">暂无用户数据</div>'; return; }

                    return `<label style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:${hasMail ? 'pointer' : 'not-allowed'};font-size:13px;" title="${hasMail ? u.email : '未绑定邮箱'}">
                        <input type="checkbox" data-mail-user="${u.username}" data-mail-email="${hasMail ? u.email : ''}" ${hasMail ? 'onchange="mailUpdateSummary()"' : 'disabled'} style="accent-color:var(--accent);">
                        <span style="flex:1;color:${hasMail ? 'var(--text-primary)' : 'var(--text-muted)'};">${u.username}</span>
                        <span style="font-size:11px;color:${hasMail ? 'var(--text-tertiary)' : 'var(--danger)'};max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${hasMail ? u.email : '未绑定邮箱'}</span>

        // 切换正文模式
        function mailSetMode(mode) {
            __mailMode = mode;
            const mdBtn = document.getElementById('mailModeMd');
            const htmlBtn = document.getElementById('mailModeHtml');
            if (mdBtn) { mdBtn.className = 'nt-btn ' + (mode === 'md' ? 'primary' : 'secondary'); }
            if (htmlBtn) { htmlBtn.className = 'nt-btn ' + (mode === 'html' ? 'primary' : 'secondary'); }
            mailRefreshPreview();

        // 渲染正文为邮件预览（带轻量外壳，贴近实际收件效果）
        function mailRenderBody() {
            const ta = document.getElementById('mailBody');
            const raw = ta ? ta.value : '';
            if (!raw.trim()) return { html: '', alt: '' };
            let html;
            if (__mailMode === 'md') {
                try { html = typeof marked !== 'undefined' ? marked.parse(raw) : raw.replace(/\n/g, '<br>'); }
                catch (e) { html = raw.replace(/\n/g, '<br>'); }
            } else {
                html = raw;
            }
            const shell = `<div style="background:#ffffff;color:#333333;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.7;padding:24px;border-radius:12px;">${html}</div>`;
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            const alt = (tmp.textContent || '').trim();
            return { html: shell, alt: alt };
        }

        function mailRefreshPreview() {
            const pv = document.getElementById('mailPreview');
            if (!pv) return;
            const { html } = mailRenderBody();
            pv.innerHTML = html || '<span style="color:var(--text-muted);">预览效果将显示在这里...</span>';
        }

        // 汇总收件人（勾选用户 + 手动输入，去重）
        function mailCollectTo() {
            const set = [];
            document.querySelectorAll('#mailUserList input[type="checkbox"]:checked').forEach(cb => {
                const em = cb.getAttribute('data-mail-email');
                if (em && set.indexOf(em) === -1) set.push(em);
            });
            const manual = document.getElementById('mailManualTo');
            if (manual && manual.value.trim()) {
                manual.value.split(/[,，;；\s]+/).forEach(s => {
                    s = s.trim();
                    if (s && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) && set.indexOf(s) === -1) set.push(s);
                });
            }
            return set;
        }

        function mailUpdateSummary() {
            const s = document.getElementById('mailToSummary');
            if (s) s.textContent = mailCollectTo().length;
        }

        // 发送邮件
        async function mailSend() {
            const toList = mailCollectTo();
            const subject = document.getElementById('mailSubject')?.value.trim() || '';
            if (!toList.length) { mailShowStatus('请先选择用户或输入收件人邮箱', 'error'); return; }
            if (!subject) { mailShowStatus('请填写邮件主题', 'error'); return; }
            const { html, alt } = mailRenderBody();
            if (!html.trim()) { mailShowStatus('请填写邮件正文', 'error'); return; }

            if (!confirm(`确定发送邮件给 ${toList.length} 个收件人？\n主题：${subject}`)) return;

            const btn = document.querySelector('button[onclick="mailSend()"]');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...'; }
            const resEl = document.getElementById('mailResult');
            if (resEl) resEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> 正在逐封发送，请稍候...</div>';

            try {
                const token = localStorage.getItem('authToken');
                const r = await fetch('../api/admin/mail_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ action: 'send', to: toList, subject: subject, html: html, altBody: alt })
                });
                const d = await r.json();
                if (d.success) mailShowStatus(d.message, 'success'); else mailShowStatus(d.message || '发送失败', 'error');
                if (resEl) {
                    const rows = (d.data?.results || []).map(it => `
                        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border-color);font-size:13px;">
                            <i class="fas ${it.success ? 'fa-check-circle' : 'fa-times-circle'}" style="color:${it.success ? 'var(--success)' : 'var(--danger)'};"></i>
                            <span style="color:var(--text-primary);flex:1;word-break:break-all;">${it.to}</span>
                            <span style="color:var(--text-tertiary);font-size:12px;">${it.success ? '已发送' : (it.message || '失败')}</span>
                        </div>`).join('');
                    resEl.innerHTML = `<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;overflow:hidden;">
                        <div style="padding:12px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-color);">
                            <i class="fas fa-list-alt" style="color:var(--accent);"></i> 发送结果
                            <span style="margin-left:auto;font-size:12px;color:var(--text-tertiary);font-weight:400;">成功 ${d.data?.success_count ?? 0} / 失败 ${d.data?.fail_count ?? 0}</span>
                        </div>${rows || '<div style="padding:16px;color:var(--text-muted);text-align:center;">无结果</div>'}</div>`;
                }
            } catch (e) {
                mailShowStatus('网络错误：' + e.message, 'error');
                if (resEl) resEl.innerHTML = '';
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> 发送邮件'; }
            }
        }

        async function startDataBackup() {
