                <div id="galleryGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;"><div style="text-align:center;padding:80px;color:var(--text-muted);grid-column:1/-1;font-size:14px;">加载中...</div></div>`;

        const GalleryModule = { images: [] };
        async function loadGalleryImages() {
            try {
                const token = localStorage.getItem('authToken');
                const r = await fetch('../api/image_api/gallery_manager.php?action=list', { headers: { 'Authorization': 'Bearer ' + token } });

            }

        // 统一解析图片 URL：将绝对路径转为相对路径，兼容开发/生产环境
        function resolveImageUrl(img) {
            if (!img || !img.url) return '../assets/img/404.webp';
            // 如果已经是从根路径开始的相对路径
            if (img.url.startsWith('/')) return '..' + img.url;
            // 如果是绝对 URL（http://...），去掉协议和域名部分
            try {
                const parsed = new URL(img.url);
                return '..' + parsed.pathname;
            } catch(e) {
                // 兜底：如果已经是相对路径
                if (img.url.startsWith('../') || img.url.startsWith('./')) return img.url;
                return '../' + img.url;
            }
        }

        function renderGalleryGrid() {
            const grid = document.getElementById('galleryGrid');
            if (!GalleryModule.images.length) { grid.innerHTML = '<div style="class="panel-empty" style="padding:60px;grid-column:1/-1;">暂无图片</div>'; return; }
            grid.innerHTML = GalleryModule.images.map(img => {
                const url = resolveImageUrl(img);
                return `<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;overflow:hidden;cursor:pointer;transition:all 0.15s;" onclick="viewGalleryImage('${img.id}')" onmouseover="this.style.boxShadow='var(--shadow-elevated)'" onmouseout="this.style.boxShadow='none'">
      <div style="width:100%;height:150px;overflow:hidden;background:var(--bg-body);"><img src="${url}" onerror="this.src='../assets/img/404.webp'" style="width:100%;height:100%;object-fit:cover;"></div>
      <div style="padding:10px;"><div style="font-size:12px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${img.filename || img.original_name || '未知'}</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${img.width || 0}×${img.height || 0}</div></div>
    </div>`;
            }).join('');
        }

        function viewGalleryImage(id) {
            const img = GalleryModule.images.find(i => i.id === id) || GalleryModule.images.find(i => i.id == id);
            if (!img) return;
            const url = resolveImageUrl(img);
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;justify-content:center;align-items:center;';
            overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

    <div style="padding:12px 16px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;"><span style="font-size:14px;font-weight:600;color:var(--text-primary);">${img.filename || img.original_name || '图片'}</span><button onclick="this.closest('div[style]').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);">&times;</button></div>
    <div style="flex:1;overflow-y:auto;padding:16px;text-align:center;"><img src="${url}" style="max-width:100%;max-height:300px;border-radius:8px;"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border-color);display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--text-tertiary;">
      <span>大小: ${(img.size / 1024).toFixed(1)} KB</span><span>尺寸: ${img.width}×${img.height}</span><span>上传者: ${img.username || '-'}</span>
      <div style="width:100%;display:flex;gap:8px;margin-top:4px;">
        <button class="nt-btn secondary" onclick="navigator.clipboard.writeText('${url}');showToast('链接已复制','success');"><i class="fas fa-link"></i> 复制链接</button>
        <button class="nt-btn danger" onclick="if(confirm('确定删除?')){deleteGalleryImage('${id}');this.closest('div[style]').remove();}"><i class="fas fa-trash"></i> 删除</button>
      </div>
    </div></div>`;
            document.body.appendChild(overlay);
        }

        async function uploadGalleryImage(input) {

                const token = localStorage.getItem('authToken');
                const r = await fetch('../api/image_api/gallery_manager.php?action=upload', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });

function renderUserTable() {
    const el = document.getElementById('userContent');
    if (!UserModule.all.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">未找到用户</div>'; return; }
    const total = UserModule.all.length;
    const start = (UserModule.page - 1) * UserModule.perPage;
    const pageItems = UserModule.all.slice(start, start + UserModule.perPage);
    const totalPages = Math.ceil(total / UserModule.perPage);
    const currentUsername = JSON.parse(localStorage.getItem('currentUser') || '{}').username || '';

    el.innerHTML = `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">
    <tr style="background:var(--border-light);">${['ID', '用户名', '邮箱', '角色', '验证', '积分', '注册时间', '操作'].map(h => `<th style="padding:8px 12px;text-align:left;border:1px solid var(--border-color);color:var(--text-secondary);word-break:keep-all;">${h}</th>`).join('')}</tr>
    ${pageItems.map(u => {
      const isSelf = u.username === currentUsername;
      const isAdmin = u.role === 'admin';
      return `<tr>
        <td style="padding:6px 12px;border:1px solid var(--border-color);color:var(--text-tertiary);">${u.id}</td>
        <td style="padding:6px 12px;border:1px solid var(--border-color);color:var(--text-primary);font-weight:500;">${u.username}${isSelf ? ' <span style="font-size:10px;color:var(--text-muted);">(你)</span>' : ''}</td>
        <td style="padding:6px 12px;border:1px solid var(--border-color);color:var(--text-tertiary);">${u.email || '-'}</td>
        <td style="padding:6px 12px;border:1px solid var(--border-color);"><span style="padding:2px 8px;border-radius:4px;font-size:11px;${isAdmin ? 'background:rgba(250,173,20,0.15);color:var(--warning);' : 'background:var(--border-light);color:var(--text-tertiary);'}">${isAdmin ? '<i class="fas fa-crown"></i> ' : ''}${u.role}</span></td>
        <td style="padding:6px 12px;border:1px solid var(--border-color);color:${u.email_verified ? 'var(--success)' : 'var(--text-muted)'};">${u.email_verified ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>'}</td>
        <td style="padding:6px 12px;border:1px solid var(--border-color);color:var(--text-tertiary);">${u.points ?? 0}</td>
        <td style="padding:6px 12px;border:1px solid var(--border-color);color:var(--text-tertiary);">${u.registered_at || '-'}</td>
        <td style="padding:6px 12px;border:1px solid var(--border-color);">${
          isSelf
            ? '<span style="font-size:11px;color:var(--text-muted);">-</span>'
            : isAdmin
              ? `<button class="nt-btn secondary" onclick="setUserRole('${u.username}','user')" style="font-size:11px;padding:3px 8px;border-radius:4px;"><i class="fas fa-user"></i> 设为用户</button>`
              : `<button class="nt-btn primary" onclick="setUserRole('${u.username}','admin')" style="font-size:11px;padding:3px 8px;border-radius:4px;"><i class="fas fa-crown"></i> 设为管理员</button>`
        }</td>
      </tr>`;
    }).join('')}
  </table></div>
  <div style="display:flex;justify-content:center;gap:8px;margin-top:12px;align-items:center;">
    <button class="nt-btn secondary" onclick="UserModule.page>1&&(UserModule.page--,renderUserTable())" ${UserModule.page <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>
    <span style="font-size:13px;color:var(--text-tertiary);">${UserModule.page}/${totalPages}</span>
    <button class="nt-btn secondary" onclick="UserModule.page<${totalPages}&&(UserModule.page++,renderUserTable())" ${UserModule.page >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>
  </div>`;
}

window.setUserRole = async function(username, newRole) {
    const action = newRole === 'admin' ? '提升为管理员' : '降级为普通用户';
    if (!confirm('确定将 ' + username + ' ' + action + '？')) return;
    try {
        const token = localStorage.getItem('authToken');
        const r = await fetch('../api/user_manager.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ action: 'set_role', username: username, role: newRole })
        });
        const d = await r.json();
        if (d.success) {
            showToast(d.message, 'success');
            loadUserData();
        } else {
            showToast(d.message || '操作失败', 'error');
        }
    } catch (e) {
        showToast('操作失败', 'error');
    }
};

            async function renderExistingPolls() {
                const el = document.getElementById('poll-results-list');
                if (!el) return;
                try {
                    const resp = await fetch('../api/forum.php');
                    const d = await resp.json();
                    if (!d.success) { el.innerHTML = '<div class="nt-empty"><i class="fas fa-exclamation-circle"></i><span>加载失败</span></div>'; return; }
                    const polled = d.data.posts.filter(p => p.poll);
                    if (!polled.length) {
                        el.innerHTML = '<div class="nt-empty"><i class="fas fa-inbox"></i><span>暂无投票</span><span style="font-size:13px;color:var(--text-muted);">在左侧创建第一个投票</span></div>';
                        return;
                    }

                    let html = '';
                    polled.forEach(p => {
                        const poll = p.poll;
                        const total = poll.votes.reduce((a,b) => a + b, 0);
                        const maxVote = Math.max(...poll.votes, 1);

                        html += '<div class="card-lift" style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:16px;margin-bottom:12px;">';

                        // 头部
                        html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">';
                        html += '<div style="flex:1;min-width:0;">';
                        html += '<div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(p.title) + '</div>';
                        html += '<div style="font-size:12px;color:var(--text-muted);"><i class="fas fa-question-circle" style="margin-right:4px;"></i>' + escHtml(poll.question) + '</div>';
                        html += '</div>';
                        html += '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">';
                        html += '<span style="font-size:12px;background:#f0f0ff;color:#a29bfe;padding:3px 10px;border-radius:12px;font-weight:500;">' + total + ' 票</span>';
                        html += '<button class="nt-btn danger" onclick="if(confirm(\'确定删除该投票？\'))removeAdminPoll(\'' + p.id + '\')" style="padding:4px 10px;font-size:12px;border-radius:6px;"><i class="fas fa-trash-alt"></i></button>';
                        html += '</div></div>';

                        // 选项条
                        poll.options.forEach((opt, idx) => {
                            const count = poll.votes[idx] || 0;
                            const pct = total > 0 ? Math.round(count / total * 100) : 0;
                            const isWinner = count === maxVote && count > 0;
                            const barColor = isWinner ? 'linear-gradient(90deg,#a29bfe,#6c5ce7)' : 'rgba(162,155,254,0.15)';

                            html += '<div style="position:relative;margin-bottom:6px;border-radius:8px;overflow:hidden;">';
                            html += '<div style="position:absolute;left:0;top:0;height:100%;width:' + pct + '%;background:' + barColor + ';border-radius:8px;transition:width 0.6s ease;"></div>';
                            html += '<div style="position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:8px 12px;">';
                            html += '<span style="flex:1;font-size:13px;color:var(--text-primary);font-weight:' + (isWinner ? '600' : '400') + ';">' + escHtml(opt) + '</span>';
                            html += '<span style="font-size:12px;color:var(--text-muted);min-width:30px;text-align:right;">' + count + '</span>';
                            html += '<span style="font-size:12px;font-weight:700;color:' + (isWinner ? '#6c5ce7' : '#a29bfe') + ';min-width:40px;text-align:right;">' + pct + '%</span>';
                            html += '</div></div>';
                        });

                        html += '</div>';
                    });
                    el.innerHTML = html;
                } catch (e) {
                    el.innerHTML = '<div class="nt-empty"><i class="fas fa-exclamation-circle"></i><span>加载失败</span></div>';
                }
            }

        window.addAdminPollOpt = function() {
            const c = document.getElementById('poll-admin-options');
            if (c.querySelectorAll('input').length >= 10) return;
            const d = document.createElement('div');
            d.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;';
            d.innerHTML = '<input type="text" class="poll-admin-opt" placeholder="选项 ' + (c.querySelectorAll('input').length + 1) + '" style="flex:1;padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;font-size:13px;"><button class="nt-btn danger" onclick="this.closest(\'div\').remove()" style="padding:4px 10px;font-size:12px;"><i class="fas fa-times"></i></button>';
            c.appendChild(d);
        };

        window.submitAdminPoll = async function() {
            const postId = document.getElementById('poll-post-id').value.trim() || document.getElementById('poll-post-select').value;
            if (!postId) { showToast('请选择帖子', 'error'); return; }
            const question = document.getElementById('poll-q').value.trim() || '投票';
            const inputs = document.querySelectorAll('.poll-admin-opt');
            const options = [];
            inputs.forEach(inp => { const v = inp.value.trim(); if (v) options.push(v); });
            if (options.length < 2) { showToast('至少需要 2 个选项', 'error'); return; }
            try {
                const token = localStorage.getItem('authToken');
                const resp = await fetch('../api/forum.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ action: 'update_poll', postId: postId, poll: { question, options } })
                });
                const d = await resp.json();
                if (d.success) { showToast('投票创建成功', 'success'); location.reload(); }
                else showToast(d.message || '创建失败', 'error');
            } catch (e) { showToast('创建失败', 'error'); }
        };

        window.removeAdminPoll = async function(postId) {
            if (!confirm('确定删除该投票？投票数据将丢失。')) return;
            try {
                const token = localStorage.getItem('authToken');
                const resp = await fetch('../api/forum.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ action: 'update_poll', postId: postId, remove: true })
                });
                const d = await resp.json();
                if (d.success) { showToast('投票已删除', 'success'); location.reload(); }
                else showToast(d.message || '删除失败', 'error');
            } catch (e) { showToast('删除失败', 'error'); }
        };

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        window.chatSelectConv = async function(convId) {
            chatManagerConvId = convId;
            try {
                const token = localStorage.getItem('authToken');
                const r = await fetch('../api/message.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ action: 'admin_messages', conv_id: convId })
                });
                const d = await r.json();

                chatManagerMsgs = d.data.messages || [];

        window.qnSave = async function() {
            const title = document.getElementById('qnTitle').value.trim();
            if (!title) { showToast('请输入问卷标题', 'error'); return; }
            const desc = document.getElementById('qnDesc').value.trim();
            const qDivs = document.querySelectorAll('#qnQuestions .qn-question');
            const questions = [];
            let valid = true;
            qDivs.forEach(qd => {
                const qTitle = qd.querySelector('.qn-q-title').value.trim();
                if (!qTitle) { valid = false; return; }
                const type = qd.querySelector('.qn-q-type').value;
                const required = qd.querySelector('.qn-required').checked;
                const q = { id: 'q' + Date.now() + '_' + questions.length, title: qTitle, type: type, required: required };
                if (type !== 'text') {
                    const opts = [];
                    qd.querySelectorAll('.qn-opt').forEach(inp => {
                        const v = inp.value.trim();
                        if (v) opts.push(v);
                    });
                    if (opts.length < 2) { valid = false; return; }
                    q.options = opts;
                }
                questions.push(q);
            });
            if (!valid || !questions.length) { showToast('请完整填写题目信息（选择题至少2个选项）', 'error'); return; }

            const token = localStorage.getItem('authToken');
            const url = '../api/questionnaire.php';
            let body = { action: 'create', title, desc, questions };
            if (qnEditingId) body = { action: 'update', id: qnEditingId, title, desc, questions };

            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(body)
            });
            const d = await r.json();
            if (d.success) { showToast('问卷已保存', 'success'); qnCloseModal(); qnLoadList(); }
            else showToast(d.message || '保存失败', 'error');
        };

        window.qnViewResults = async function(id) {

            try {
                const r = await fetch('../api/questionnaire.php?action=results&id=' + id, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('authToken') }
                });
                const d = await r.json();
                if (!d.success) { showToast(d.message || '加载失败', 'error'); return; }
                const qn = d.data.questionnaire;
                const stats = d.data.stats || {};

                let html = '<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:28px 36px;width:90%;max-width:1200px;margin:0 auto;">';
                html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';

                html += '<div style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">共 ' + qn.responses.length + ' 份回答 · ' + (qn.status === 'active' ? '进行中' : '已关闭') + '</div>';

                qn.questions.forEach(qItem => {

                    html += '<div style="margin-bottom:20px;padding:16px 20px;background:var(--bg-secondary);border-radius:8px;">';
                    html += '<div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:10px;">' + escHtml(qItem.title) + (qItem.required ? ' <span style="color:var(--danger);font-size:12px;">*</span>' : '') + ' <span style="font-size:11px;color:var(--text-muted);font-weight:400;">[' + qItem.type + ']</span></div>';
                    if (qItem.type === 'text' && s) {
                        (s.texts || []).forEach(t => { html += '<div style="font-size:13px;color:var(--text-secondary);padding:8px 14px;background:var(--bg-card);border-radius:6px;margin-bottom:6px;border-left:4px solid var(--accent);line-height:1.6;">' + escHtml(t) + '</div>'; });
                        if (!(s.texts || []).length) html += '<div style="font-size:12px;color:var(--text-muted);">暂无回答</div>';
                    } else if (s && s.options) {
                        const total = Object.values(s.options).reduce((a,b) => a + b, 0) || 1;
                        Object.entries(s.options).forEach(([opt, count]) => {
                            const pct = Math.round(count / total * 100);
                            html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">';
                            html += '<span style="flex:0 0 200px;font-size:13px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(opt) + '</span>';

                            html += '</div>';
                            html += '<span style="font-size:13px;color:var(--text-muted);min-width:80px;text-align:right;font-weight:500;">' + count + ' 票 <span style="font-weight:400;color:#999;">(' + pct + '%)</span></span>';
                            html += '</div>';
                        });
                    }
                    html += '</div>';
                });

                html += '<div style="margin-top:16px;display:flex;gap:8px;">';
                html += '<a href="../api/questionnaire.php?action=export&id=' + id + '" target="_blank" class="nt-btn primary" style="font-size:13px;display:inline-flex;align-items:center;gap:6px;"><i class="fas fa-download"></i> 导出 CSV</a>';

                wrap.id = 'qnResultView';

                wrap.innerHTML = html;
                wrap.onclick = function(e) { if (e.target === wrap) this.remove(); };
                document.body.appendChild(wrap);
            } catch(e) { showToast('加载结果失败', 'error'); }
        };

        // ── MCP 控制台 ────────────────────────────────
        function renderMcpConsole(page, content) {
            content.innerHTML = pageHeader("fas fa-terminal", "MCP 控制台", "直接调用 MCP 工具，管理服务器实例", "var(--accent)", "<span id=\"mcpStatus\" style=\"font-size:12px;color:var(--text-muted);background:var(--bg-body);padding:6px 12px;border-radius:6px;border:1px solid var(--border-color);\"><span style=\"color:var(--warning);\">●</span> 连接中...</span><button class=\"nt-btn secondary\" onclick=\"connectMcpConsole()\" style=\"font-size:12px;padding:6px 12px;\"><i class=\"fas fa-sync\"></i> 重连</button>") + `
                <div style="display:grid;grid-template-columns:260px 1fr;gap:16px;">
                    <div style="background:var(--bg-card);border-radius:10px;border:1px solid var(--border-color);padding:14px;max-height:520px;overflow-y:auto;">
                        <h3 style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text-primary);"><i class="fas fa-wrench" style="color:var(--accent);margin-right:6px;"></i>可用工具</h3>
                        <div id="mcpToolList"><div style="font-size:12px;color:var(--text-muted);padding:12px;text-align:center;">加载中...</div></div>

                    <div style="background:var(--bg-card);border-radius:10px;border:1px solid var(--border-color);padding:18px;">

                            <h4 style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text-primary);"><i class="fas fa-code" style="color:var(--accent);margin-right:6px;"></i>执行结果</h4>

        const McpModule = { tools: [], selectedTool: null };

        async function connectMcpConsole() {
            document.getElementById('mcpStatus').innerHTML = '<span style="color:var(--warning);">●</span> 连接中...';
            try {
                const tools = await McpClient.listTools();
                McpModule.tools = tools;
                document.getElementById('mcpStatus').innerHTML = '<span style="color:var(--success);">●</span> 已连接 · ' + McpModule.tools.length + ' 个工具';
                renderMcpToolList();
            } catch (e) {
                document.getElementById('mcpStatus').innerHTML = '<span style="color:var(--danger);">●</span> 连接失败';
                document.getElementById('mcpToolList').innerHTML = '<div style="font-size:12px;color:var(--danger);padding:8px;">连接失败: ' + e.message + '</div>';
            }
        }

        function renderMcpToolList() {
            const list = document.getElementById('mcpToolList');
            if (!McpModule.tools.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px;">暂无可用工具</div>'; return; }
            list.innerHTML = McpModule.tools.map(t => `
    <div onclick="selectMcpTool('${t.name}')" id="mcp-tool-${t.name}" style="padding:10px 12px;border:1px solid var(--border-color);border-radius:6px;margin-bottom:4px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border-color)'">
      <div style="font-size:13px;font-weight:500;color:var(--text-primary);">${t.name} ${t.requiresConfirm ? '<span style="font-size:10px;color:#fff;background:var(--danger);padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle;">⚠️ 需确认</span>' : ''}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${t.description?.substring(0, 60) || '无描述'}</div>
    </div>`).join('');
        }

        function selectMcpTool(name) {
            McpModule.selectedTool = McpModule.tools.find(t => t.name === name);
            if (!McpModule.selectedTool) return;
            document.querySelectorAll('[id^="mcp-tool-"]').forEach(el => el.style.borderColor = 'var(--border-color)');
            const el = document.getElementById('mcp-tool-' + name);
            if (el) el.style.borderColor = 'var(--accent)';

            document.getElementById('mcpToolTitle').textContent = '工具: ' + name;
            document.getElementById('mcpResult').style.display = 'none';
            document.getElementById('mcpExecBtn').style.display = 'block';

            const schema = McpModule.selectedTool.inputSchema?.properties || {};
            const required = McpModule.selectedTool.inputSchema?.required || [];
            const keys = Object.keys(schema);
            if (!keys.length) {
                document.getElementById('mcpParamForm').innerHTML = '<p style="font-size:12px;color:var(--text-muted);">该工具无需参数</p>';
                return;
            }
            document.getElementById('mcpParamForm').innerHTML = keys.map(k => `
    <div class="nt-form-group">
      <label>${k} ${required.includes(k) ? '<span style="color:var(--danger);">*</span>' : ''}</label>
      <input type="text" id="mcp-param-${k}" placeholder="${schema[k]?.description || k}" data-required="${required.includes(k)}" style="class="panel-input" style="padding:8px 12px;">
    </div>`).join('');
        }

        async function executeMcpTool() {
            if (!McpModule.selectedTool) return;
            const args = {};
            const inputs = document.querySelectorAll('[id^="mcp-param-"]');
            inputs.forEach(inp => {
                const key = inp.id.replace('mcp-param-', '');
                const val = inp.value.trim();
                if (val) args[key] = val;
            });

            document.getElementById('mcpExecBtn').disabled = true;
            document.getElementById('mcpExecBtn').innerHTML = '<span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:6px;"></span> 执行中...';

            try {
                const result = await McpClient.request('tools/call', { name: McpModule.selectedTool.name, arguments: args });
                const output = result.result || result.error || result;
                document.getElementById('mcpResult').style.display = 'block';
                document.getElementById('mcpResultContent').textContent = JSON.stringify(output, null, 2);
            } catch (e) {
                document.getElementById('mcpResult').style.display = 'block';
                document.getElementById('mcpResultContent').textContent = '执行失败: ' + e.message;
            } finally {
                document.getElementById('mcpExecBtn').disabled = false;
                document.getElementById('mcpExecBtn').innerHTML = '<i class="fas fa-play"></i> 执行';
            }
        }

        async function testAiConnection() {
            const key = document.getElementById('ai-api-key').value.trim();
            if (!key) { showToast('请先输入 API Key', 'error'); return; }
            const modelSel = document.getElementById('ai-model');
            const model = modelSel.value === 'custom'
                ? (document.getElementById('ai-custom-model')?.value?.trim() || 'Echo-1.5-Pro')
                : modelSel.value;
            const endpoint = document.getElementById('ai-api-endpoint').value.trim();
            const tokens = parseInt(document.getElementById('ai-max-tokens').value) || 2048;

            showToast('正在测试连接...', 'info');
            try {
                // 走后端代理，避免浏览器直接跨域请求上游 API，同时复用服务端的 provider 路由逻辑
                const resp = await fetch('../api/ai/api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'test_connection',
                        api_key: key,
                        model: model,
                        endpoint: endpoint,
                        max_tokens: Math.min(tokens, 64),
                        temperature: 0.1
                    })
                });
                const data = await resp.json();
                if (resp.ok && data.success) {
                    showToast(`连接成功 ✅ ${data.model} · ${data.elapsed_ms}ms`, 'success');
                } else {
                    const err = data.error || '未知错误';
                    showToast(`连接失败 ❌ ${err}`, 'error');
                }
            } catch(e) {
                showToast('连接失败: ' + e.message, 'error');
            }
        }

        // 将历史条目转为上下文文本行（兼容旧版字符串与新版对象）
        function aiEntryToLine(e) {
            if (typeof e === 'string') return e;

        // HTML 转义，避免工具返回的 JSON 破坏页面结构
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // 以可折叠卡片展示工具返回：展示完整结果（不再截断），长内容默认折叠以节省 UI 空间
        function aiAssistantAddToolResult(toolName, resultStr) {

                        '<pre class="tool-result-json">' + escapeHtml(resultStr) + '</pre>' +

        // 精简工具返回，避免超大字段（如 start_command）截断导致模型看不到全部实例
        function sanitizeToolResultForLlm(toolName, resultStr) {
            let data;
            try { data = JSON.parse(resultStr); } catch (e) { return resultStr; }
            const compact = (inst) => ({
                name: inst.name,
                uuid: inst.uuid,
                daemonId: inst.daemonId,
                status: inst.status,
                players: inst.players,
                version: inst.version,
                cpu: inst.process ? inst.process.cpu : undefined,
                memory: inst.process ? inst.process.memory : undefined,
                auto_start: inst.auto_start,
                auto_restart: inst.auto_restart
            });
            if (toolName === 'list_instances' && data && Array.isArray(data.instances)) {
                data.instances = data.instances.map(compact);
            }
            if (toolName === 'get_instance_detail' && data && typeof data === 'object') {
                if (data.start_command) {
                    const s = String(data.start_command);
                    data.start_command = s.length > 80 ? (s.substring(0, 80) + '…') : s;
                }
            }
            return JSON.stringify(data, null, 2);
        }

        // 结构化记录一条对话（带时间戳），用于日志与导出
        function aiLog(role, text) {
            AiAssistantModule.history.push({ role, text, ts: Date.now() });
            aiAssistantSaveHistory();
        }

        // 一键导出对话为 Markdown 文件
        function aiAssistantExport() {
            if (!AiAssistantModule.history.length) {
                aiAssistantAddMsg('system', '⚠️ 暂无可导出的对话记录');
                return;
            }
            const now = new Date();
            const lines = ['# 万驹同源 · 管理 AI 助手对话导出', ''];
            lines.push('> 导出时间：' + now.toLocaleString('zh-CN'));
            lines.push('> 记录条数：' + AiAssistantModule.history.length);
            lines.push('');
            lines.push('---');
            lines.push('');
            for (const e of AiAssistantModule.history) {
                const role = (typeof e === 'string')
                    ? (e.startsWith('用户：') ? '用户' : e.startsWith('助手：') ? '助手' : '系统')
                    : (e.role || '系统');
                const text = (typeof e === 'string') ? e.replace(/^(用户|助手|系统)：/, '') : (e.text || '');
                const ts = (typeof e === 'object' && e.ts) ? new Date(e.ts).toLocaleString('zh-CN') : '';
                lines.push((ts ? '**[' + ts + ']** ' : '') + '**' + role + '**：');
                lines.push(text);
                lines.push('');
            }
            const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const stamp = now.toISOString().slice(0, 19).replace(/[:T]/g, '-');
            a.download = 'AI助手对话_' + stamp + '.md';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            aiAssistantAddMsg('system', '📤 对话已导出为 Markdown 文件');
        }

        async function aiAssistantSend() {
            if (AiAssistantModule.busy) return;
            const input = document.getElementById('aiChatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            aiAssistantAddMsg('user', text);
            aiLog('user', text);

            AiAssistantModule.busy = true;
            const sendBtn = document.getElementById('aiSendBtn');
            if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 思考中'; }

            try {
                const model = localStorage.getItem('deepseek_model') || 'deepseek-chat';
                const mcpToolsForLlm = AiAssistantModule.mcpTools.map(t => ({ name: t.name, description: t.description }));

                let userMsg = text;
                let round = 0;
                while (round < 4) {
                    round++;
                    const answer = await aiAssistantChat(userMsg, model, mcpToolsForLlm);
                    const parsed = parseAllToolCalls(answer);

                    // 如果模型回复里包含非工具调用的说明文字，先展示给管理员
                    if (parsed.displayText) {
                        aiAssistantAddMsg('ai', parsed.displayText);
                        aiLog('ai', parsed.displayText);
                    }

                    // 没有工具调用，直接结束
                    if (parsed.toolCalls.length === 0) {
                        break;
                    }

                    // 依次执行本轮识别出的所有工具调用
                    const batchResults = [];
                    for (let tidx = 0; tidx < parsed.toolCalls.length; tidx++) {
                        const toolCall = parsed.toolCalls[tidx];

                        // 显示友好进度（隐藏原始 arguments 细节）
                        const argsStr = toolCall.arguments ? Object.keys(toolCall.arguments).join(', ') : '';
                        aiAssistantAddMsg('system', '🔧 正在执行 `' + toolCall.name + '`' + (argsStr ? '（参数：' + argsStr + '）' : '') + '…');

                        // 工具白名单校验：避免模型臆造不存在的工具名导致死循环
                        if (AiAssistantModule.mcpTools.length) {
                            const knownTool = AiAssistantModule.mcpTools.find(t => t.name === toolCall.name);
                            if (!knownTool) {
                                const avail = AiAssistantModule.mcpTools.map(t => t.name).join('、');
                                aiAssistantAddMsg('system', '⚠️ 工具「' + toolCall.name + '」不存在，可用工具：' + avail);
                                userMsg = '你调用的工具「' + toolCall.name + '」不存在。可用工具只有：' + avail + '。请改用正确工具名，重新基于已有上下文回答管理员的问题：' + text;
                                AiAssistantModule.history.push('系统：工具 ' + toolCall.name + ' 不存在，已提示可用工具');
                                aiAssistantSaveHistory();
                                continue; // 给模型一次自我纠正的机会（受 round<4 限制）
                            }
                        }

                        // 破坏性操作确认护栏：requiresConfirm 工具必须显式 confirm:true
                        if (AiAssistantModule.mcpTools.length) {
                            const kt = AiAssistantModule.mcpTools.find(t => t.name === toolCall.name);
                            if (kt && kt.requiresConfirm && !(toolCall.arguments && toolCall.arguments.confirm === true)) {
                                aiAssistantAddMsg('system', '⚠️ 工具「' + toolCall.name + '」是破坏性操作，需要显式确认。请在 TOOL_CALL 的 arguments 中加入 "confirm": true 后重新发起。');
                                userMsg = '工具「' + toolCall.name + '」是破坏性操作，你必须在 TOOL_CALL 的 arguments 中加上 "confirm": true 才能执行（例如 {"name":"' + toolCall.name + '","arguments":{"uuid":"...","daemonId":"...","confirm":true}}）。请确认这是管理员想要的，并重新发起调用以继续执行原始需求：' + text;
                                AiAssistantModule.history.push('系统：工具 ' + toolCall.name + ' 需确认，已要求 confirm:true');
                                aiAssistantSaveHistory();
                                continue; // 回到循环顶部，等模型带 confirm:true 重新调用
                            }
                        }

                        // 执行工具，最多重试 1 次
                        let toolResult, toolFailed = false;
                        for (let retry = 0; retry <= 1; retry++) {
                            try {
                                const res = await McpClient.callTool(toolCall.name, toolCall.arguments || {});
                                toolResult = (typeof res === 'string') ? res : JSON.stringify(res, null, 2);
                                toolFailed = false;
                                break;
                            } catch (e) {
                                toolFailed = true;
                                if (retry < 1) {
                                    aiAssistantAddMsg('system', '⏳ 执行失败，正在重试…');
                                    await new Promise(r => setTimeout(r, 500));
                                } else {
                                    toolResult = '工具执行失败：' + e.message;
                                }
                            }
                        }

                        if (toolFailed) {
                            aiAssistantAddMsg('system', '⚠️ 工具「' + toolCall.name + '」执行失败，已跳过本轮。可重新描述你的需求再试。');
                            AiAssistantModule.history.push('系统：工具 ' + toolCall.name + ' 执行失败');
                            aiAssistantSaveHistory();
                            break;
                        }

                        // 展示完整工具返回（可折叠，长内容默认折叠，保证不被截断）
                        aiAssistantAddToolResult(toolCall.name, toolResult);

                        // 精简工具返回（剔除 start_command 等超大字段），确保模型能拿到全部实例而非被截断
                        const safeResult = sanitizeToolResultForLlm(toolCall.name, toolResult);
                        batchResults.push('【工具 ' + (tidx + 1) + '：' + toolCall.name + '】\n' + safeResult);

                        AiAssistantModule.history.push('系统：工具 ' + toolCall.name + ' 已执行并获得结果');
                        aiAssistantSaveHistory();
                    }

                    if (!batchResults.length) {
                        // 本轮没有任何成功结果，退出循环避免空轮
                        break;
                    }

                    // 拼入完整上下文（历史 + 本轮所有结果），确保多轮工具调用不丢失上文
                    const contextLines = AiAssistantModule.history.slice(-20).map(aiEntryToLine).join('\n');
                    userMsg = '以下是完整上下文与本轮所有工具执行结果。请基于此用中文回答管理员最初的问题（' + text + '）：\n\n'
                        + '【完整上下文】\n' + contextLines + '\n\n'
                        + '【本轮工具结果】\n' + batchResults.join('\n\n').substring(0, 16000);
                }
            } catch (e) {
                aiAssistantAddMsg('system', '⚠️ 出错了：' + e.message);
            } finally {
                AiAssistantModule.busy = false;
                if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 发送'; }
            }
        }

        async function aiAssistantChat(message, model, mcpTools) {
            // 统一走 PHP 代理 api.php\uff08本地与生产同源，确保 provider 回退链与工具指令注入一致\uff1b
            //   历史原因：本函数曾有 IS_LOCAL 直连 Echo API 的分支，但 Echo 物理上不产出 TOOL_CALL: 格式\uff0c
            //   导致工具链断路，故统一收敛到服务端大脑\uff09

            const resp = await fetch('../api/ai/api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    persona: 'admin',
                    model: model,
                    mcp_tools: mcpTools,
                    temperature: 0.7,
                    max_tokens: 4096,
                })
            });
            const data = await resp.json();
            if (!resp.ok || !data.success) {
                throw new Error(data.error?.message || data.message || ('HTTP ' + resp.status));
            }
            // 兼容推理模型\uff1acontent 为空时回退 reasoning_content
            let msg = data.message;
            if (!msg && data.raw_response) msg = data.raw_response;
            return msg || '(空回复)';
        }

        function extractJsonObject(str, start) {
            let depth = 0;
            let inString = false;
            let stringChar = null;
            let escape = false;
            for (let i = start; i < str.length; i++) {
                const c = str[i];
                if (escape) {
                    escape = false;
                    continue;
                }
                if (c === '\\') {
                    escape = true;
                    continue;
                }
                if (!inString && (c === '"' || c === "'")) {
                    inString = true;
                    stringChar = c;
                    continue;
                }
                if (inString && c === stringChar) {
                    inString = false;
                    stringChar = null;
                    continue;
                }
                if (inString) continue;
                if (c === '{') depth++;
                else if (c === '}') { depth--; if (depth === 0) return str.substring(start, i + 1); }
            }
            return null;
        }

        function parseAllToolCalls(text) {
            const toolCalls = [];
            let displayText = text || '';

            const extractors = [
                // TOOL_CALL:{...} —— 用 extractJsonObject 平衡花括号，正确处理嵌套 arguments
                (s) => {
                    const m = s.match(/TOOL_CALL\s*:\s*\{/);
                    if (!m) return null;
                    const braceStart = m.index + m[0].length - 1; // '{' 的绝对位置
                    const json = extractJsonObject(s, braceStart);
                    if (!json) return null;
                    return {
                        raw: s.substring(m.index, braceStart + json.length),
                        json: json,
                        start: m.index,
                        end: braceStart + json.length,
                    };
                },
                // <function=name>...</function>
                (s) => {
                    const match = s.match(/<function\s*=\s*([a-zA-Z0-9_]+)\s*>([\s\S]*?)<\/function>/);
                    if (!match) return null;
                    return { raw: match[0], name: match[1], args: match[2], start: match.index, end: match.index + match[0].length };
                },
                // 纯 JSON 工具调用 {"name":"...","arguments":{...}}
                (s) => {
                    const match = s.match(/\{\s*"name"\s*:\s*"([^"]+)"\s*,\s*"arguments"\s*:/);
                    if (!match) return null;
                    const jsonStr = extractJsonObject(s, match.index);
                    if (!jsonStr) return null;
                    return { raw: jsonStr, json: jsonStr, start: match.index, end: match.index + jsonStr.length };
                }
            ];

            // 循环提取所有可识别的工具调用，直到不能再提取
            let changed = true;
            while (changed) {
                changed = false;
                for (const ext of extractors) {
                    const hit = ext(displayText);
                    if (!hit) continue;
                    try {
                        if (hit.json) {
                            const obj = JSON.parse(hit.json);
                            if (obj && obj.name) {
                                toolCalls.push({ name: obj.name, arguments: obj.arguments || {} });
                                displayText = displayText.slice(0, hit.start) + displayText.slice(hit.end);
                                changed = true;
                                break;
                            }
                        } else if (hit.name) {
                            const args = hit.args.trim() ? JSON.parse(hit.args.trim()) : {};
                            toolCalls.push({ name: hit.name, arguments: args });
                            displayText = displayText.slice(0, hit.start) + displayText.slice(hit.end);
                            changed = true;
                            break;
                        }
                    } catch (e) {}
                }
            }

            displayText = displayText.trim();
            return { toolCalls, displayText };
        }

        // 保留旧名兼容（返回首个工具调用）
        function parseToolCall(text) {
            const res = parseAllToolCalls(text);
            return res.toolCalls[0] || null;
        }

        // ── 外部页面加载器（备选） ──────────────────
        async function renderExternalPage(page, content) {
            try {
                const resp = await fetch(page.file);
                const html = await resp.text();

                // 提取 body 内容（去掉外部 html/head/body 壳）
                let bodyHtml = html;
                const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                if (bodyMatch) bodyHtml = bodyMatch[1];

                // 移除 navbar/footer placeholder（由 admin-hub 统一管理）
                bodyHtml = bodyHtml.replace(/<div\s+id="(navbar|footer)-placeholder"[^>]*><\/div>/gi, '');

                // 提取样式（去重）
                const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
                let styleMatch;
                while ((styleMatch = styleRegex.exec(html)) !== null) {
                    const styleId = 'ext-' + hashStr(styleMatch[1].substring(0, 80));
                    if (!STORE.loadedStyles.has(styleId)) {
                        STORE.loadedStyles.add(styleId);
                        const styleEl = document.createElement('style');
                        styleEl.id = styleId;
                        // 注入主题变量以便子页面样式适配
                        styleEl.textContent = styleMatch[1];
                        document.head.appendChild(styleEl);
                    }
                }

                // 注入 HTML
                content.innerHTML = bodyHtml;

                // 移除旧的子页面脚本标记（清理）
                document.querySelectorAll('script[data-ext-page]').forEach(s => s.remove());

                // 提取并执行脚本
                const scriptRegex = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
                while ((scriptMatch = scriptRegex.exec(html)) !== null) {
                    const attrs = scriptMatch[1];
                    const code = scriptMatch[2]?.trim();
                    // 跳过外部库
                    if (attrs.includes('src=')) continue;
                    if (!code) continue;

                    const script = document.createElement('script');
                    script.setAttribute('data-ext-page', page.title);
                    if (attrs) {
                        // 复制属性
                        const attrRegex = /(\w+)(?:="([^"]*)")?/g;
                        let m;
                        while ((m = attrRegex.exec(attrs)) !== null) {
                            if (m[1] !== 'src' && m[2]) script.setAttribute(m[1], m[2]);
                        }
                    }
                    script.textContent = code;
                    document.body.appendChild(script);
                }
            } catch (e) {
                content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger);">
      <i class="fas fa-exclamation-circle" style="font-size:40px;margin-bottom:16px;display:block;"></i>
      页面加载失败: ${e.message}</div>`;
            }
        }

        // ── 辅助：字符串哈希（用于样式去重） ────────────
        function hashStr(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i), h |= 0;
            return 'h' + Math.abs(h).toString(36);
        }

        // ── 主题 ──────────────────────────────────────
        const THEME_KEY = 'admin_hub_theme';
        function loadTheme() {
            const saved = localStorage.getItem(THEME_KEY) || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            document.getElementById('themeToggle').innerHTML = saved === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
        function toggleTheme() {
            const curr = document.documentElement.getAttribute('data-theme') || 'light';
            const next = curr === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem(THEME_KEY, next);
            document.getElementById('themeToggle').innerHTML = next === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }

        // ── Toast ──────────────────────────────────────
        function showToast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            const icons = { error: 'fa-times-circle', success: 'fa-check-circle', info: 'fa-info-circle' };
            t.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + msg;
            c.appendChild(t);
            setTimeout(() => { t.style.animation = 'toastIn 0.3s reverse forwards'; setTimeout(() => t.remove(), 300); }, 3000);
        }

            } catch(e) { showToast('操作失败', 'error'); }
        };

        window.shopToggle = async function(id) {
            try {
                const token = localStorage.getItem('authToken');
                const r = await fetch('../api/points/shop_admin.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'toggle', id: id, token: token })
                });
                const d = await r.json();
                if (d.success) { showToast(d.message, 'success'); shopLoadList(); }
                else { showToast(d.message, 'error'); }
            } catch(e) { showToast('操作失败', 'error'); }
        };

        window.shopDelete = function(id, name) {
            if (!confirm('确定要删除商品「' + name + '」吗？此操作不可恢复。')) return;
            const token = localStorage.getItem('authToken');
            fetch('../api/points/shop_admin.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'delete', id: id, token: token })
            }).then(r => r.json()).then(d => {
                if (d.success) { showToast(d.message, 'success'); shopLoadList(); }
                else { showToast(d.message, 'error'); }
            }).catch(() => showToast('操作失败', 'error'));
        };

        // ── 招募管理 ──────────────────────────────
        let recruitData = [];
        let recruitFilter = 'all';

        function renderRecruitments(page, content) {
            recruitData = [];
            recruitFilter = 'all';
            content.innerHTML = pageHeader("fas fa-user-plus", "招募管理", "审核团队申请 · 查看申请人 · 标记状态", "#667eea", "") + `
                <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                    <button class="nt-btn ${recruitFilter==='all'?'primary':''}" onclick="recruitFilterApply('all')">全部</button>
                    <button class="nt-btn ${recruitFilter==='pending'?'primary':''}" onclick="recruitFilterApply('pending')">待审核</button>
                    <button class="nt-btn ${recruitFilter==='approved'?'primary':''}" onclick="recruitFilterApply('approved')">已通过</button>
                    <button class="nt-btn ${recruitFilter==='rejected'?'primary':''}" onclick="recruitFilterApply('rejected')">已拒绝</button>
                </div>
                <div id="recruitContainer" class="module-card" style="border-top:3px solid #667eea;">
                    <div style="text-align:center;padding:30px;color:var(--text-tertiary);">加载中...</div>
                </div>
            `;
            recruitLoad();
        }

        async function recruitLoad() {
            const token = localStorage.getItem('authToken');
            try {
                const resp = await fetch('../api/recruit.php?token=' + encodeURIComponent(token));
                const d = await resp.json();
                if (d.success) {
                    recruitData = d.data || [];
                    recruitRenderList();
                } else {
                    document.getElementById('recruitContainer').innerHTML = '<p style="color:var(--danger);padding:20px;">加载失败：' + (d.error||'未知错误') + '</p>';
                }
            } catch(e) {
                document.getElementById('recruitContainer').innerHTML = '<p style="color:var(--danger);padding:20px;">网络错误</p>';
            }
        }

        function recruitFilterApply(f) {
            recruitFilter = f;
            document.querySelectorAll('.nt-btn').forEach(b => b.classList.remove('primary'));
            event.target.classList.add('primary');
            recruitRenderList();
        }

        function recruitRenderList() {
            const posMap = {builder:'建筑师',developer:'开发者',artist:'美术师',assistant:'运营助理',tester:'测试员',designer:'内容策划'};
            const statusMap = {pending:'待审核',approved:'已通过',rejected:'已拒绝'};
            const statusColor = {pending:'#d69e2e',approved:'#38a169',rejected:'#e53e3e'};
            const filtered = recruitFilter === 'all' ? recruitData : recruitData.filter(a => a.status === recruitFilter);

            if (!filtered.length) {
                document.getElementById('recruitContainer').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-tertiary);">暂无' + (recruitFilter==='all'?'申请':statusMap[recruitFilter]+'的申请') + '</div>';
                return;
            }

            let html = '';
            filtered.forEach(app => {
                html += `
                <div class="module-card" style="margin-bottom:12px;border-left:4px solid ${statusColor[app.status]||'#ccc'};">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
                        <div>
                            <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:4px;">
                                ${app.username}
                                <span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;background:${statusColor[app.status]}22;color:${statusColor[app.status]};margin-left:8px;">${statusMap[app.status]||app.status}</span>
                            </div>
                            <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:8px;">
                                <i class="fas fa-briefcase" style="margin-right:4px;"></i>${posMap[app.position]||app.position}
                                <span style="margin:0 8px;">·</span>
                                <i class="fas fa-clock" style="margin-right:4px;"></i>${app.createdAt}
                            </div>
                            <div style="font-size:13px;color:var(--text-secondary);line-height:1.7;">
                                <div><strong>联系方式：</strong>${app.contact}</div>
                                ${app.experience ? '<div><strong>相关经验：</strong>' + app.experience + '</div>' : ''}
                                ${app.portfolio ? '<div><strong>作品集：</strong><a href="' + app.portfolio + '" target="_blank" style="color:#667eea;">查看</a></div>' : ''}
                                ${app.message ? '<div><strong>留言：</strong>' + app.message + '</div>' : ''}
                                ${app.adminNote ? '<div style="margin-top:6px;padding:6px 10px;background:var(--bg-main);border-radius:6px;"><strong>管理员备注：</strong>' + app.adminNote + '</div>' : ''}
                            </div>
                        </div>
                        <div style="display:flex;gap:6px;flex-shrink:0;">
                            ${app.status==='pending' ? `
                                <button class="nt-btn primary" onclick="recruitAction('${app.id}','approved')" style="font-size:12px;"><i class="fas fa-check"></i> 通过</button>
                                <button class="nt-btn" style="font-size:12px;color:var(--danger);border-color:var(--danger);" onclick="recruitAction('${app.id}','rejected')"><i class="fas fa-times"></i> 拒绝</button>
                            ` : ''}
                            <button class="nt-btn" style="font-size:12px;" onclick="recruitNote('${app.id}')"><i class="fas fa-sticky-note"></i> 备注</button>
                            <button class="nt-btn" style="font-size:12px;color:var(--danger);border-color:var(--danger);" onclick="recruitDelete('${app.id}','${app.username}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('recruitContainer').innerHTML = html;
        }

        window.recruitAction = async function(id, status) {
            const token = localStorage.getItem('authToken');
            try {
                const resp = await fetch('../api/recruit.php', {
                    method: 'PUT',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ id, status, token })
                });
                const d = await resp.json();
                if (d.success) { showToast('已更新', 'success'); recruitLoad(); }
                else showToast(d.error||'操作失败', 'error');
            } catch(e) { showToast('网络错误', 'error'); }
        };

        window.recruitNote = function(id) {
            const app = recruitData.find(a => a.id === id);
            const note = prompt('请输入管理员备注：', app ? app.adminNote || '' : '');
            if (note === null) return;
            const token = localStorage.getItem('authToken');
            fetch('../api/recruit.php', {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id, status: app.status, adminNote: note, token })
            }).then(r => r.json()).then(d => {
                if (d.success) { showToast('备注已保存', 'success'); recruitLoad(); }
                else showToast(d.error||'操作失败', 'error');
            }).catch(() => showToast('网络错误', 'error'));
        };

        window.recruitDelete = function(id, name) {
            if (!confirm('确定要删除「' + name + '」的申请吗？此操作不可恢复。')) return;
            const token = localStorage.getItem('authToken');
            fetch('../api/recruit.php?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token), {
                method: 'DELETE'
            }).then(r => r.json()).then(d => {
                if (d.success) { showToast('已删除', 'success'); recruitLoad(); }
                else showToast(d.error||'操作失败', 'error');
            }).catch(() => showToast('网络错误', 'error'));
        };
    </script>
</body>

</html>
